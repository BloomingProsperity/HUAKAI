syntax = "proto3";

package huakai.route.v1;

service RouteService {
  rpc RouteQuery(RouteQueryRequest) returns (RoutePlan);
  rpc AttemptReport(AttemptReportRequest) returns (AttemptReportResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message CapabilityHint {
  string name = 1;
  string value = 2;
}

message PreviousAttempt {
  string attempt_id = 1;
  string route_plan_id = 2;
  string account_id = 3;
  string status = 4;
  int32 http_status = 5;
  bool retryable = 6;
  string error_class = 7;
  uint64 latency_ms = 8;
}

message RouteQueryRequest {
  string request_id = 1;
  string tenant_id = 2;
  string requested_model = 3;
  string session_hash = 4;
  string request_protocol = 5;
  bool stream = 6;
  uint64 client_deadline_ms = 7;
  repeated PreviousAttempt previous_attempts = 8;
  repeated CapabilityHint capability_hints = 9;
}

message UpstreamAuthMaterial {
  string material_kind = 1;
  bytes material = 2;
  string header_name = 3;
  uint64 expires_at_unix_ms = 4;
}

message RoutePlan {
  string route_plan_id = 1;
  string account_id = 2;
  bytes acquisition_token = 3;
  string vendor = 4;
  string upstream_model = 5;
  string vendor_endpoint = 6;
  string credentials_handle = 7;
  string auth_mode = 8;
  uint64 route_ttl_ms = 9;
  uint64 attempt_deadline_ms = 10;
  uint64 max_body_bytes = 11;
  uint64 max_stream_frame_bytes = 12;
  UpstreamAuthMaterial upstream_auth = 13;
}

message TokensUsed {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 total_tokens = 3;
  string source = 4;
}

message CacheMetrics {
  uint64 cache_read_tokens = 1;
  uint64 cache_write_tokens = 2;
  bool cache_hit = 3;
  string source = 4;
}

message AttemptReportRequest {
  string request_id = 1;
  string route_plan_id = 2;
  string attempt_id = 3;
  bytes acquisition_token = 4;
  string status = 5;
  int32 http_status = 6;
  int64 started_at = 7;
  int64 ended_at = 8;
  uint64 latency_ms = 9;
  TokensUsed tokens_used = 10;
  CacheMetrics cache_metrics = 11;
  uint64 bytes_in = 12;
  uint64 bytes_out = 13;
  uint64 frames_in = 14;
  uint64 frames_out = 15;
  string vendor_request_id = 16;
  bool retryable = 17;
  string error_class = 18;
  string error_message_redacted = 19;
  string idempotency_key = 20;
}

message AttemptReportResponse {
  bool ack = 1;
  string ack_id = 2;
  int64 accepted_at = 3;
  string advisory = 4;
}

message HealthCheckRequest {
  string request_id = 1;
  string caller = 2;
  string schema_version = 3;
}

message HealthCheckResponse {
  string schema_version = 1;
  int64 server_time = 2;
  string route_service_status = 3;
  bool ready = 4;
}

message HeartbeatRequest {
  string node_id = 1;
  string build_sha = 2;
  string schema_version = 3;
  int64 started_at = 4;
  uint64 in_flight_requests = 5;
  uint64 open_upstream_connections = 6;
  uint64 attempt_report_queue_depth = 7;
  double p95_control_plane_rpc_ms = 8;
  double error_rate_1m = 9;
}

message HeartbeatResponse {
  bool ack = 1;
  string desired_schema_version = 2;
  bool drain_mode = 3;
}
