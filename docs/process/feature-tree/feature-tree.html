<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUAKAI 功能树 · 推进 + 修复 状态地图</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171d26; --panel2:#1e2630; --line:#2a3340;
    --txt:#e6edf3; --dim:#8b98a9; --accent:#4da3ff;
    --red:#e5534b; --orange:#e3873c; --yellow:#d9c64a; --green:#3fb950; --blue:#4da3ff; --grey:#566;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 80px}
  h1{font-size:21px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .err{background:#3a1d1d;border:1px solid var(--red);padding:16px;border-radius:8px;margin-top:20px}
  .err code{background:#000;padding:2px 6px;border-radius:4px}
  /* dashboard */
  .dash{display:grid;grid-template-columns:230px 1fr;gap:14px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .gauge{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .big{font-size:46px;font-weight:700;line-height:1}
  .gauge .lbl{color:var(--dim);font-size:12px;margin-top:6px;text-align:center}
  .axis{display:grid;grid-template-columns:120px 1fr 42px;gap:8px;align-items:center;margin:3px 0;font-size:12.5px}
  .axis .nm{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .axis .pc{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
  .bar{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:5px}
  .fixstat{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
  .fixstat .s{font-size:12.5px;color:var(--dim)}
  .fixstat .s b{font-size:17px;color:var(--txt);margin-right:3px}
  /* controls */
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
  .controls input,.controls select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 9px;font-size:13px}
  .controls input{flex:1;min-width:160px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;user-select:none}
  .chip.on{background:#143;border-color:var(--green);color:#cdebd2}
  .legend{font-size:11.5px;color:var(--dim);margin:6px 0 0;display:flex;gap:14px;flex-wrap:wrap}
  /* tree */
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
  .sechd{display:grid;grid-template-columns:26px 1fr 150px 90px 150px;gap:10px;align-items:center;padding:11px 13px;cursor:pointer}
  .sechd:hover{background:var(--panel2)}
  .sechd .tw{color:var(--dim);font-size:12px;transition:transform .15s}
  .sechd.open .tw{transform:rotate(90deg)}
  .sechd .nm{font-weight:600;font-size:15px}
  .sechd .nm small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
  .pcwrap{display:flex;align-items:center;gap:7px}
  .pcwrap .pct{font-variant-numeric:tabular-nums;font-size:12.5px;width:34px;text-align:right;color:var(--dim)}
  .fixmini{font-size:11.5px;color:var(--dim);text-align:right;white-space:nowrap}
  .leaves{display:none;padding:2px 0 8px}
  .sec.open .leaves{display:block}
  .leaf{display:grid;grid-template-columns:26px 1fr 150px 90px 150px;gap:10px;align-items:start;padding:7px 13px;border-top:1px solid var(--line)}
  .leaf:hover{background:var(--panel2)}
  .leaf .stg{font-size:15px;text-align:center;cursor:default}
  .leaf .nm{font-size:13.5px}
  .leaf .nm .fid{color:var(--accent);font-size:11px;font-family:ui-monospace,monospace;margin-left:6px}
  .leaf .nm .vf{color:var(--green);font-weight:700;margin-left:6px;cursor:help}
  .leaf .nm .parity{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .leaf .nm .pk{display:block;color:#6b7a8d;font-size:10.5px;font-family:ui-monospace,monospace;margin-top:1px}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;margin:1px 2px 1px 0;white-space:nowrap}
  .b-land{background:#143d22;color:#7ee29a;border:1px solid #2d6a3f}
  .b-open{background:#3a2a14;color:#e3b777;border:1px solid #6a4f2d}
  .b-def{background:#2a2438;color:#c0a8e8;border:1px solid #4f3f6a}
  .fixcell{font-size:11px}
  .hl{background:#3a3416 !important}
  .foot{margin-top:22px;color:var(--dim);font-size:12px}
  .panel-h{font-size:15px;font-weight:600;margin:22px 0 8px}
  .gap{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
  .gap .it{font-weight:600}
  .gap .rf{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <h1>HUAKAI 功能树 · 推进 + 修复 状态地图</h1>
  <div class="sub" id="sub"></div>
  <div id="root"></div>
</div>
<script>
const STAGE = {
  spec:{i:"📋",n:"仅spec"}, partial:{i:"🟡",n:"部分"}, wired:{i:"🔵",n:"已接线"},
  tested:{i:"✅",n:"测试/生产"}, deadcode:{i:"⚠️",n:"死码/名实不符"}, missing:{i:"❌",n:"缺失"}, nogo:{i:"⛔",n:"NO-GO"}
};
function pctColor(p){ return p>=80?"var(--green)":p>=60?"var(--yellow)":p>=30?"var(--orange)":"var(--red)"; }
function bar(p){ return `<div class="bar"><i style="width:${p}%;background:${pctColor(p)}"></i></div>`; }
function secPct(s){ const ls=s.leaves; return Math.round(ls.reduce((a,l)=>a+(l.pct||0),0)/ls.length); }
function secFix(s){ let land=0,open=0,def=0; s.leaves.forEach(l=>{const f=l.fix||{}; land+=(f.landed||[]).length; open+=(f.open||[]).length; def+=(f.deferred||[]).length;}); return {land,open,def}; }
// escapes &<> AND both quote chars, so esc() is safe in text content AND inside
// double/single-quoted attribute values (live /tasks fields are attacker-influenceable).
function esc(x){ return (x==null?"":(""+x)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let DATA=null, state={q:"",stage:"",onlyOpen:false,onlyVerified:false};

// --- live dispatch overlay: match the /tasks ledger onto tree nodes by finding id ---
// (a leaf's fix.landed/deferred/open ARE finding ids, e.g. S2-114, so the task↔node
//  link already exists; no schema change needed.) Populated only when coordinator-served.
var LIVE_TASKS = {};            // findingId -> task {status, assignee, ...}
var OVERLAY_ON = false;
var LIVE_ERR = "";              // last /tasks fetch error; surfaced — never silently shown as "empty ledger"
const TASK_STAT = {
  todo:{c:"#8b98a9",t:"待派"},  // legal default status (coord_server TASK_STATUSES) — must show, else backlog hides
  assigned:{c:"#9ecbff",t:"已派"}, in_progress:{c:"#f0c674",t:"在改"}, review:{c:"#c9a7f0",t:"待审"},
  done:{c:"#7ee29a",t:"完成"}, blocked:{c:"#ff8b8b",t:"卡住"}, needs_owner:{c:"#ff5f5f",t:"待你批"}
};
function liveTag(id){
  var t=LIVE_TASKS[id]; if(!t) return "";
  var s=TASK_STAT[t.status]||{c:"#8b98a9",t:t.status};
  return `<span style="font-size:10px;padding:0 5px;margin-left:3px;border:1px solid ${s.c};color:${s.c};border-radius:9px"`+
    ` title="${esc(t.assignee||'')} · ${esc((t.status||''))}">▶${esc(s.t)}${t.assignee?'·'+esc(t.assignee):''}</span>`;
}

function fixBadges(f){
  f=f||{}; let h="";
  (f.landed||[]).forEach(x=>h+=`<span class="badge b-land">✅${esc(x)}</span>`+liveTag(x));
  (f.deferred||[]).forEach(x=>h+=`<span class="badge b-def">⏸${esc(x)}</span>`+liveTag(x));
  (f.open||[]).forEach(x=>h+=`<span class="badge b-open">○${esc(x)}</span>`+liveTag(x));
  return h||'<span style="color:#566">—</span>';
}

// All finding ids that ARE mapped onto the tree (any leaf's fix.*).
function treeFindingIds(){
  var s=new Set();
  (DATA.sections||[]).forEach(sec=>sec.leaves.forEach(l=>{
    var f=l.fix||{}; ["landed","deferred","open"].forEach(k=>(f[k]||[]).forEach(id=>s.add(id)));
  }));
  return s;
}

// Start the real-time overlay: poll /tasks every 5s and re-render. Coordinator-only.
function startOverlay(){
  var tok=sessionStorage.getItem("COORD_TOKEN");
  if(!ON_COORD || !tok || OVERLAY_ON) return;
  OVERLAY_ON=true;
  function refresh(){
    fetch("/tasks",{headers:{Authorization:"Bearer "+tok}})
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status+(r.status===401?" · token 可能已失效":"")); return r.json(); })
      .then(d=>{ LIVE_ERR=""; LIVE_TASKS={}; (d.tasks||[]).forEach(t=>{LIVE_TASKS[t.id]=t;}); if(DATA) render(); })
      // never collapse a fetch/auth failure into an empty ledger — surface it, keep the last-known snapshot.
      .catch(e=>{ LIVE_ERR=(e&&e.message)||(""+e); if(DATA) render(); });
  }
  refresh(); setInterval(refresh, 5000);
}

function leafMatch(l){
  if(state.stage && l.stage!==state.stage) return false;
  if(state.onlyOpen && !((l.fix&&l.fix.open||[]).length)) return false;
  if(state.onlyVerified && !l.verified) return false;
  if(state.q){ const q=state.q.toLowerCase();
    const hay=(l.name+" "+(l.fid||"")+" "+(l.pkgs||[]).join(" ")+" "+(l.parity||"")+" "+JSON.stringify(l.fix||{})).toLowerCase();
    if(!hay.includes(q)) return false; }
  return true;
}

function render(){
  const m=DATA.meta;
  const wsum=m.weighted_axes.reduce((a,x)=>a+x.weight,0);
  const overall=Math.round(m.weighted_axes.reduce((a,x)=>a+x.weight*x.pct,0)/wsum);
  document.getElementById("sub").innerHTML=
    `生成 ${esc(m.generated)} · supersedes <code style="color:#8b98a9">${esc(m.supersedes)}</code> · 两条轴:【建设进度】+【问题修复】 · ✓=已对真实代码深核,无✓=文档综合(声称)`;

  const fc=m.fix_campaign;
  let axes=m.weighted_axes.map(x=>`<div class="axis"><span class="nm" title="${esc(x.name)}">${esc(x.name)} ·${x.weight}%</span>${bar(x.pct)}<span class="pc">${x.pct}%</span></div>`).join("");

  let dash=`<div class="dash">
    <div class="card gauge"><div class="big" style="color:${pctColor(overall)}">${overall}%</div><div class="lbl">建设加权完工度<br>(9 轴 · 02_FUSION_ARCH)</div></div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:6px">建设进度 — 9 加权轴</div>${axes}
      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:9px;font-weight:600">问题修复 — 195 条第三方审计核实</div>
      <div class="fixstat">
        <span class="s"><b style="color:var(--green)">${fc.landed}</b>已落地</span>
        <span class="s"><b style="color:#c0a8e8">${fc.deferred}</b>延后(钱路gate)</span>
        <span class="s"><b style="color:var(--orange)">${fc.open_real}</b>待修(Wave3-8)</span>
        <span class="s"><b style="color:var(--dim)">${fc.refuted_or_alreadyfixed_or_drifted}</b>不修(伪/已修)</span>
        <span class="s"><b>${fc.real}</b>/${fc.total} 核实为真</span>
      </div>
    </div>
  </div>`;

  let ctrls=`<div class="controls">
    <input id="q" placeholder="🔎 搜索 能力/F-ID/代码包/finding…" value="${esc(state.q)}">
    <select id="stage"><option value="">全部阶段</option>${Object.entries(STAGE).map(([k,v])=>`<option value="${k}"${state.stage===k?" selected":""}>${v.i} ${v.n}</option>`).join("")}</select>
    <span class="chip${state.onlyOpen?" on":""}" id="cOpen">有未决 finding ○</span>
    <span class="chip${state.onlyVerified?" on":""}" id="cVer">仅已核实 ✓</span>
    <span class="chip" id="cExpand">展开全部</span><span class="chip" id="cCollapse">折叠全部</span>
  </div>
  <div class="legend">${Object.values(STAGE).map(v=>`<span>${v.i} ${v.n}</span>`).join("")}<span>· 进度条色:🔴&lt;30 🟠30-60 🟡60-80 🟢≥80</span></div>`;

  let tree=DATA.sections.map((s,si)=>{
    const vis=s.leaves.filter(leafMatch);
    const anyFilter=state.q||state.stage||state.onlyOpen||state.onlyVerified;
    if(anyFilter && !vis.length) return "";
    const sp=secPct(s), sf=secFix(s);
    const openCls=(anyFilter|| s._open)?" open":"";
    const leaves=(anyFilter?vis:s.leaves).map(l=>{
      const f=l.fix||{};
      return `<div class="leaf">
        <div class="stg" title="${STAGE[l.stage]?STAGE[l.stage].n:l.stage}">${STAGE[l.stage]?STAGE[l.stage].i:"·"}</div>
        <div class="nm">${esc(l.name)}${l.fid&&l.fid!=="-"?`<span class="fid">${esc(l.fid)}</span>`:""}${l.verified?`<span class="vf" title="已对真实代码深核">✓</span>`:""}
          <span class="parity">${esc(l.parity||"")}</span>
          <span class="pk">${(l.pkgs||[]).join(" · ")}</span></div>
        <div class="pcwrap">${bar(l.pct)}<span class="pct">${l.pct}%</span></div>
        <div></div>
        <div class="fixcell">${fixBadges(f)}</div>
      </div>`;
    }).join("");
    return `<div class="sec${openCls}" data-si="${si}">
      <div class="sechd${openCls}">
        <span class="tw">▶</span>
        <span class="nm">${esc(s.id)} ${esc(s.name)}<small>${esc(s.summary||"")}</small></span>
        <div class="pcwrap">${bar(sp)}<span class="pct">${sp}%</span></div>
        <div></div>
        <div class="fixmini">✅${sf.land} ⏸${sf.def} ○${sf.open}</div>
      </div>
      <div class="leaves">${leaves}</div>
    </div>`;
  }).join("");

  // reference parity gaps + codex diff
  const rp=DATA.reference_parity_union||{};
  let gaps=`<div class="panel-h">参考项目对照 — 候选缺口(未核实:repo@sha:file:line 证据见 2026-05-21 audit-A~E + 2026-05-30 侦察,回源核实前不作结论)</div>
    <div class="card"><div style="color:var(--dim);font-size:12px;margin-bottom:6px">${esc(rp.note||"")}</div>
    ${(rp.gaps||[]).map(g=>`<div class="gap"><div class="it">${esc(g.item)}</div><div class="rf"><b>${esc(g.ref)}</b> → ${esc(g.huakai)}</div></div>`).join("")}</div>`;

  const cd=DATA.codex_diff||{};
  let diff=`<div class="panel-h">vs codex 2026-05-21 树</div><div class="card" style="font-size:12.5px">
    <div><b>补齐 codex 漏列子系统</b>:${(cd.added_subsystems_codex_missed||[]).map(esc).join(" · ")}</div>
    <div style="margin-top:8px"><b>纠正</b>:${esc(cd.corrected||"")}</div>
    <div style="margin-top:8px;color:var(--dim)">已深核 ✓ 节点:${(cd.verified_nodes||[]).map(esc).join(" · ")}</div>
  </div>`;

  // 实时调度叠加层(coordinator-served 时显示):谁在弄哪个模块 + 树外未登记的活
  let live="";
  if(OVERLAY_ON){
    const tasks=Object.values(LIVE_TASKS), tids=treeFindingIds();
    const unmapped=tasks.filter(t=>!tids.has(t.id));
    const byStat={}; tasks.forEach(t=>{(byStat[t.status]=byStat[t.status]||[]).push(t);});
    const order=["in_progress","review","needs_owner","blocked","assigned","todo","done"];
    const chips=order.filter(s=>byStat[s]).map(s=>{const m=TASK_STAT[s]||{c:"#8b98a9",t:s};
      return `<span style="font-size:12px;padding:2px 9px;margin:0 5px 5px 0;border:1px solid ${m.c};color:${m.c};border-radius:11px;display:inline-block">${esc(m.t)} ${byStat[s].length}</span>`;}).join("");
    const active=(byStat.in_progress||[]).concat(byStat.review||[],byStat.needs_owner||[]).map(t=>{
      const m=TASK_STAT[t.status]||{t:t.status}; return `<div style="margin:2px 0">▶ <b>${esc(t.assignee||'?')}</b> · <code>${esc(t.id)}</code> ${esc(t.title||'')} <span style="color:var(--dim)">[${esc(m.t)}]</span>${t.review_notes?` <span style="color:var(--orange)">↩ ${esc(t.review_notes)}</span>`:""}</div>`;}).join("");
    const um=unmapped.length?`<div style="margin-top:9px;padding-top:8px;border-top:1px solid var(--line);color:var(--orange)"><b>🆕 ${unmapped.length} 个未登记到功能树的活</b>(树外新功能/突发任务 → 需排进功能树):<br><span style="font-size:12px">${unmapped.map(t=>`<code>${esc(t.id)}</code> ${esc(t.title||'')} → ${esc(t.assignee||'未派')}`).join("　·　")}</span></div>`:"";
    const errBanner=LIVE_ERR?`<div style="margin-bottom:7px;padding:5px 9px;border:1px solid var(--orange);color:var(--orange);border-radius:7px;font-size:12.5px">⚠️ 实时数据获取失败:${esc(LIVE_ERR)} — 下面是最后一次成功快照,可能已过期</div>`:"";
    live=`<div class="panel-h">实时调度叠加 · 谁在弄哪个模块(每 5 秒刷新 · 源自 /tasks 账本)</div>
      <div class="card">${errBanner}${tasks.length?chips:'<span style="color:var(--dim)">(账本暂无任务)</span>'}
      <div style="margin-top:6px;font-size:12.5px">${active||'<span style="color:var(--dim)">(当前无人在改)</span>'}</div>${um}</div>`;
  }

  document.getElementById("root").innerHTML=dash+live+ctrls+tree+gaps+diff+
    `<div class="foot">改 <code>feature-tree.json</code> 任一 <code>pct</code>/<code>fix</code> 存盘 → 刷新本页即更新(视图/数据分离)。叠加层实时读 <code>/tasks</code> 账本(谁在弄哪个模块 + 树外新活)。来源:codex 树 + 02 加权 + 03 parity matrix + audit MASTER(195)+ 修复战役亲历。</div>`;

  // wire events
  const q=document.getElementById("q"); q.oninput=e=>{state.q=e.target.value; render(); document.getElementById("q").focus();};
  document.getElementById("stage").onchange=e=>{state.stage=e.target.value; render();};
  document.getElementById("cOpen").onclick=()=>{state.onlyOpen=!state.onlyOpen; render();};
  document.getElementById("cVer").onclick=()=>{state.onlyVerified=!state.onlyVerified; render();};
  document.getElementById("cExpand").onclick=()=>{DATA.sections.forEach(s=>s._open=true); render();};
  document.getElementById("cCollapse").onclick=()=>{DATA.sections.forEach(s=>s._open=false); render();};
  document.querySelectorAll(".sechd").forEach(h=>h.onclick=()=>{
    const si=+h.parentElement.dataset.si; DATA.sections[si]._open=!DATA.sections[si]._open; render();
  });
}

// Two load paths from ONE file:
//  • Local (Live Preview / python -m http.server): ./feature-tree.json loads directly.
//  • Hosted on the coordination server at /tree: that fetch 404s, so we fall back
//    to the token-gated /tree/data endpoint (token pasted once, kept in sessionStorage).
function loadRemote(tok){
  return fetch("/tree/data",{headers:{Authorization:"Bearer "+tok}}).then(r=>{
    if(r.status===401) throw new Error("401");
    if(!r.ok) throw new Error("http "+r.status);
    return r.json();
  });
}
function tokenBox(msg){
  var saved=sessionStorage.getItem("COORD_TOKEN")||"";
  document.getElementById("root").innerHTML=`<div class="err"><b>${esc(msg)}</b><br>
  贴入协调服务 token 看进度地图(只读,token 只存本浏览器会话,不进 URL):<br>
  <input id="tok" type="password" value="${esc(saved)}" placeholder="COORD_TOKEN"
   style="width:60%;padding:8px;margin:8px 6px 0 0;background:#0d1420;border:1px solid #2a3950;color:#cfe;border-radius:6px">
  <button id="go" style="padding:8px 16px;background:#143d2a;color:#7fe0a8;border:1px solid #1e5c3f;border-radius:6px;cursor:pointer">看</button></div>`;
  document.getElementById("go").onclick=function(){
    var t=document.getElementById("tok").value.trim(); if(!t) return;
    sessionStorage.setItem("COORD_TOKEN",t);
    loadRemote(t).then(d=>{DATA=d; render(); startOverlay();}).catch(e=>tokenBox("token 不对或加载失败:"+esc(e.message)));
  };
}
function localHelp(msg){
  document.getElementById("root").innerHTML=`<div class="err"><b>无法加载 feature-tree.json</b><br>
  浏览器在 <code>file://</code> 下禁止读取本地 JSON(CORS)。请用 http 预览:<br>
  ① VSCode 装 <b>Live Preview</b> 扩展 → 右键本文件 <i>Open with Live Preview</i>;或<br>
  ② 终端 <code>cd docs/process/feature-tree && python3 -m http.server</code> 然后开 <code>http://localhost:8000/feature-tree.html</code><br>

}
// Token fallback is enabled ONLY when the coordinator server itself served this
// page — it injects window.__COORD_SERVED__. The raw file hosted by any other
// origin/proxy/docs-site (which cannot inject that marker) shows local help on a
// JSON failure and never prompts for, or POSTs, the coordination token.
var ON_COORD = (window.__COORD_SERVED__ === true);
fetch("./feature-tree.json").then(r=>{if(!r.ok)throw new Error("http "+r.status);return r.json();})
 .then(d=>{DATA=d; render(); startOverlay();})
 .catch(e=>{
   if(!ON_COORD){ localHelp(e.message); return; }
   var saved=sessionStorage.getItem("COORD_TOKEN");
   if(saved){ loadRemote(saved).then(d=>{DATA=d; render(); startOverlay();}).catch(()=>tokenBox("功能树进度地图 · 需要 token")); }
   else tokenBox("功能树进度地图 · 需要 token");
 });
</script>
