      responses:
        '200':
          description: Bootstrap JWT.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /internal/runner/refresh:
    post:
      tags: [hermes-internal]
      summary: Refresh a Hermes runner JWT
      operationId: refreshHermesRunnerJWT
      description: >-
        Internal endpoint that verifies an existing Hermes JWT and returns a replacement before expiry.
        Requires HMAC proof: X-Hermes-Signature, X-Hermes-Timestamp, X-Hermes-Tenant,
        X-Hermes-User computed over `<timestamp>\n<method>\n<path>\n<raw_query>\n<tenant>\n<user>\n`
        + body, signed with HUAKAI_HERMES_INTERNAL_SHARED_SECRET HMAC-SHA256.
      security: []
      parameters:
        - name: X-Hermes-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Tenant
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-User
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Refreshed JWT.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /internal/keys:
    get:
      tags: [hermes-internal]
      summary: List active Hermes JWT public keys
      operationId: listHermesRunnerJWTKeys
      description: >-
        Internal public-key sync endpoint for Hermes runner local verifier cache.
        Requires HMAC proof: X-Hermes-Signature, X-Hermes-Timestamp, X-Hermes-Tenant,
        X-Hermes-User computed over `<timestamp>\n<method>\n<path>\n<raw_query>\n<tenant>\n<user>\n`
        + body, signed with HUAKAI_HERMES_INTERNAL_SHARED_SECRET HMAC-SHA256.
      security: []
      parameters:
        - name: X-Hermes-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Tenant
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-User
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Active public keys.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [kid, alg, public_key_pem]
                      properties:
                        kid: { type: string }
                        alg: { type: string, enum: [EdDSA] }
                        public_key_pem: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

