# HUAKAI OpenAPI 3.1 Contract — Phase 2.2 Lock (Synthesized)
# ============================================================================
# Synthesized from 3 independent drafts (Claude / Codex-gateway / Codex-admin)
# per Owner directive 'with Codex, repeated verification + review'.
# Synthesis decisions documented in SYNTHESIS.md (9 D-resolutions applied).
#
# CL-011: every component cites the Released spec(s) it derives from via
# x-huakai-spec-source extension.
# ============================================================================

openapi: 3.1.0

info:
  title: HUAKAI Gateway API
  version: 0.1.0-pre
  summary: Multi-tenant relay-station AI gateway with provider account pooling.
  description: |
    HUAKAI exposes three client-protocol-compatible relay endpoints (OpenAI Chat
    Completions, OpenAI Responses, Anthropic Messages) plus an operator admin
    API for managing Pool Groups, Provider Accounts, Routes, Usage Records,
    Billing Ledger, and Audit trails.

    Source-of-truth specs at `docs/specs/`. This file is the Phase 2.2
    contract lock; Phase 3 implementation skeleton derives from this contract
    via codegen.

    Per [DR-001](../process/decisions/DR-001-multi-tenancy.md), every endpoint is
    tenant-scoped; tenant is server-resolved from API Key. Cross-tenant data
    access is structurally rejected.

    JSON convention: snake_case throughout (matches OpenAI / Anthropic public
    APIs and HUAKAI database schema).

    Money fields: numeric(20, 8) precision; rendered as JSON string for
    client-side BigNumber safety.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://huakai.example/api
    description: Operator-deployed instance (URL operator-configured)

security:
  - bearerAuth: []

tags:
  - name: gateway
    description: Client-facing relay endpoints. F-GW-002 + F-PROTO-002 + F-AUTH-005.
  - name: hermes
    description: Optional Hermes assistant settings, profile management, and runner proxy endpoints.
  - name: hermes-internal
    description: Internal Hermes runner bootstrap, JWT refresh, and public-key sync endpoints.
  - name: auth
    description: HUAKAI platform User authentication. F-AUTH-007.
  - name: user-passkeys
    description: Authenticated User passkey registration, listing, and deletion.
  - name: sessions
    description: HUAKAI platform User session management. F-SESSION-001.
  - name: invitations
    description: Authenticated User invitation code creation. F-COMM-001.
  - name: user-vouchers
    description: User voucher redemption. F-BILL-002.
  - name: user-recharges
    description: Authenticated user wallet recharge order creation. F-PAY-001.
  - name: user-checkin
    description: Opt-in authenticated user daily check-in balance rewards.
  - name: user-notifications
    description: Authenticated user notification delivery settings for balance alerts.
  - name: announcements
    description: Tenant-scoped active announcement board visible to users or public tenant-scoped readers.
  - name: payment-webhooks
    description: Public provider payment webhook entrypoints with provider signature verification. F-PAY-001.
  - name: user-audit
    description: User-facing cost receipt and detached receipt verification. F-AUDIT-001.
  - name: user-api-key-controls
    description: Authenticated user controls for per-key quota policy and key group assignment.
  - name: pricing
    description: Public historical pricing tables for client-side receipt validation. F-AUDIT-001 + F-BILL-001.
  - name: audit
    description: Public audit verification key material. F-TRUST-001 + F-AUDIT-001.
  - name: trust
    description: Public trust discovery and detached signature verification endpoints. F-TRUST-001 + F-AUDIT-001.
  - name: admin-vouchers
    description: Admin voucher creation, listing, batch creation, and revocation. F-BILL-002.
  - name: admin-email
    description: Tenant-scoped SMTP email delivery settings for F-AUTH-007.
  - name: admin-platform-settings
    description: Platform-admin global feature and runtime settings.
  - name: admin-api-keys
    description: API Key issuance / list / revoke. Slice 2 N+4b2; backed by admin_tokens + admin_audit_events.
  - name: admin-pools
    description: Pool Group management. F-POOL-001.
  - name: admin-accounts
    description: Provider Account management. F-POOL-001 + F-AUTH-005 + F-RATE-001.
  - name: admin-channel-health
    description: Channel health state and operator audit visibility. F-CH-002 + F-PRIV-001.
  - name: admin-credential-acquisition
    description: Credential acquisition lifecycle and helper imports. F-CRED-001.
  - name: admin-usage
    description: Usage Record query. F-OBS-001.
  - name: admin-billing
    description: Billing Ledger query + adjustments. F-OBS-001.
  - name: admin-pricing
    description: Tenant-scoped admin pricing ratio catalog for pool groups.
  - name: admin-notifications
    description: Notification worker observability and tenant-scoped user notification settings.
  - name: admin-announcements
    description: Admin announcement CRUD for tenant-scoped operator messages.
  - name: admin-alerting
    description: Admin alert rules, firing/resolved events, and tenant-scoped silences.
  - name: admin-moderation
    description: Admin content moderation keyword and configuration controls.
  - name: admin-audit
    description: Audit trail query (rate-limit + pool-routing + oauth-refresh). F-RATE-001 + F-POOL-001 + F-AUTH-005.
  - name: admin-cache
    description: L2 response cache inspection and operator eviction. F-CACHE-002.
  - name: admin-models
    description: Platform-admin public model discovery metadata controls.
  - name: admin-model-sync
    description: Platform-admin trigger for dynamic vendor model catalog synchronization.
  - name: admin-dlq
    description: Usage Record DLQ replay. F-OBS-001.

paths:
  # ==========================================================================
  # Gateway endpoints (client-facing relay)
  # ==========================================================================

  /v1/chat/completions:
    post:
      tags: [gateway]
      summary: OpenAI Chat Completions compatible relay
      operationId: postChatCompletions
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md
        - docs/specs/protocol-translation.md
        - docs/specs/observability-billing.md
      description: |
        Accept OpenAI Chat Completions request, route to a Provider Account
        (F-POOL-001), translate via HUAKAI Canonical Stream Format (F-PROTO-002),
        return response (F-GW-002). Streaming via stream=true.

        Idempotency per F-OBS-001: when Idempotency-Key header is present, server
        derives idempotency_key from header + tenant_id + payload hash. Replays
        with same fingerprint return cached settled response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
      responses:
        '200':
          description: |
            Successful response. Content-Type is `application/json` for
            non-streaming or `text/event-stream` for streaming. SSE event
            types per F-PROTO-002 client adapter.
          headers:
            X-HUAKAI-Protocol-Loss:
              description: Comma-separated feature names that were LOSSY in this translation. Empty = fully PRESERVED. Full structured array also on Usage Record.
              schema: { type: string }
            X-HUAKAI-Idempotency-Hit:
              description: Present and 'true' when response is replayed from a settled prior claim with the same fingerprint.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SSEFrame'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/completions:
    post:
      tags: [gateway]
      summary: OpenAI legacy Completions compatible relay
      operationId: postCompletions
      x-huakai-spec-source:
        - backend/internal/completionshttp/handler.go
        - docs/specs/observability-billing.md
      description: |
        Accept OpenAI-compatible legacy text completion requests, route to a
        Provider Account through HUAKAI registry/router/pool, passthrough the
        original JSON body to upstream `/v1/completions`, and settle billing
        from upstream-reported `usage.prompt_tokens` plus
        `usage.completion_tokens`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionsRequest'
      responses:
        '200':
          description: Successful OpenAI-compatible legacy completion response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionsResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SSEFrame'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/embeddings:
    post:
      tags: [gateway]
      summary: OpenAI Embeddings compatible relay
      operationId: postEmbeddings
      x-huakai-spec-source:
        - backend/internal/embeddingshttp/handler.go
        - docs/specs/observability-billing.md
      description: |
        Accept OpenAI-compatible embeddings requests, route to a Provider
        Account through HUAKAI registry/router/pool, passthrough the request to
        the upstream `/v1/embeddings` endpoint, and settle billing from
        upstream-reported `usage.prompt_tokens` as input-only usage.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: Successful OpenAI-compatible embeddings response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/rerank:
    post:
      tags: [gateway]
      summary: Rerank relay
      operationId: postRerank
      x-huakai-spec-source:
        - backend/internal/rerankhttp/handler.go
        - docs/specs/observability-billing.md
      description: |
        Accept Cohere/Jina/Voyage-style rerank requests, route to a Provider
        Account through HUAKAI registry/router/pool, passthrough the request to
        the upstream `/v1/rerank` endpoint, and settle deterministic billing
        from search units computed as `ceil(documents/100)`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: Successful upstream-compatible rerank response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/images/generations:
    post:
      tags: [gateway]
      summary: OpenAI Images Generations compatible JSON relay
      operationId: postImagesGenerations
      x-huakai-spec-source:
        - backend/internal/imageshttp/handler.go
        - docs/specs/observability-billing.md
      description: |
        Accept OpenAI-compatible JSON image generation requests, route to a
        Provider Account, passthrough the original JSON body to
        `/v1/images/generations`, and settle billing from catalog-driven
        per-image or token-image pricing. Multipart upload is not part of this
        JSON-only slice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
      responses:
        '200':
          description: Successful upstream-compatible image generation response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/images/edits:
    post:
      tags: [gateway]
      summary: OpenAI Images Edits compatible JSON relay
      operationId: postImagesEdits
      x-huakai-spec-source:
        - backend/internal/imageshttp/handler.go
        - docs/specs/observability-billing.md
      description: |
        JSON-only image edit relay. Clients reference input images with
        `image`, `images`, or `image_url`; binary multipart is parked for the
        later passthrough-adapter slice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageEditRequest'
      responses:
        '200':
          description: Successful upstream-compatible image edit response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/images/variations:
    post:
      tags: [gateway]
      summary: OpenAI Images Variations compatible JSON relay
      operationId: postImagesVariations
      x-huakai-spec-source:
        - backend/internal/imageshttp/handler.go
        - docs/specs/observability-billing.md
      description: |
        JSON-only image variation relay. Variations require an image reference
        and do not accept a prompt in this slice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageVariationRequest'
      responses:
        '200':
          description: Successful upstream-compatible image variation response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/audio/speech:
    post:
      tags: [gateway]
      summary: OpenAI Audio Speech compatible relay
      operationId: postAudioSpeech
      x-huakai-spec-source:
        - backend/internal/audiohttp/handler.go
        - docs/specs/observability-billing.md
      description: |
        Accept OpenAI-compatible text-to-speech JSON, route through HUAKAI
        registry/router/pool, passthrough to `/v1/audio/speech`, and settle
        deterministic per-character billing from UTF-8 rune count. Inputs over
        4096 runes are rejected before reservation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioSpeechRequest'
      responses:
        '200':
          description: Successful upstream audio bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/audio/transcriptions:
    post:
      tags: [gateway]
      summary: OpenAI Audio Transcriptions compatible relay
      operationId: postAudioTranscriptions
      x-huakai-spec-source:
        - backend/internal/audiohttp/handler.go
        - docs/specs/observability-billing.md
      description: |
        Accept bounded multipart audio upload, preserve the original multipart
        body and boundary for upstream `/v1/audio/transcriptions`, and reserve
        from local duration estimation. WAV PCM duration is exact; compressed
        formats use a conservative size-bound estimate and may be marked
        pending reconciliation when upstream duration is absent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioTranscriptionRequest'
      responses:
        '200':
          description: Successful upstream transcription response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTextResponse'
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: Multipart body exceeds the 25MiB audio upload limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/audio/translations:
    post:
      tags: [gateway]
      summary: OpenAI Audio Translations compatible relay
      operationId: postAudioTranslations
      x-huakai-spec-source:
        - backend/internal/audiohttp/handler.go
        - docs/specs/observability-billing.md
      description: |
        Same lifecycle and billing behavior as `/v1/audio/transcriptions`, but
        passthrough endpoint path is `/v1/audio/translations`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioTranscriptionRequest'
      responses:
        '200':
          description: Successful upstream translation response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTextResponse'
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: Multipart body exceeds the 25MiB audio upload limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/responses:
    post:
      tags: [gateway]
      summary: OpenAI Responses compatible relay
      operationId: postResponses
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md
        - docs/specs/protocol-translation.md
        - docs/specs/observability-billing.md
      description: |
        Same orchestration as `/v1/chat/completions` but client protocol is
        OpenAI Responses. Per F-PROTO-002 hub-and-spoke topology, both share
        the HUAKAI Canonical intermediate; only the client adapter differs.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsesRequest' }
      responses:
        '200':
          description: Successful response (json or SSE per stream flag).
          headers:
            X-HUAKAI-Protocol-Loss: { schema: { type: string } }
            X-HUAKAI-Idempotency-Hit: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsesResponse' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/SSEFrame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/messages:
    post:
      tags: [gateway]
      summary: Anthropic Messages compatible relay
      operationId: postAnthropicMessages
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md
        - docs/specs/protocol-translation.md
        - docs/specs/observability-billing.md
      description: |
        Anthropic Messages compatible client surface. Same hub-and-spoke
        orchestration as the OpenAI surfaces.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessagesRequest' }
      responses:
        '200':
          description: Successful response (json or SSE per stream flag).
          headers:
            X-HUAKAI-Protocol-Loss: { schema: { type: string } }
            X-HUAKAI-Idempotency-Hit: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicMessagesResponse' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/SSEFrame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/messages/count_tokens:
    post:
      tags: [gateway]
      summary: Anthropic Messages token count relay
      operationId: postAnthropicMessagesCountTokens
      x-huakai-spec-source:
        - backend/internal/completionshttp/count_tokens.go
      description: |
        Authenticated free utility relay for Anthropic-compatible token
        counting. HUAKAI resolves the model and provider credential, forwards
        the original JSON body to upstream `/v1/messages/count_tokens`, and
        returns the upstream token-count JSON without reserve, settlement, or
        balance charge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicCountTokensRequest'
      responses:
        '200':
          description: Successful upstream-compatible token count response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicCountTokensResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/realtime:
    get:
      tags: [gateway]
      summary: Realtime WebSocket surface roadmap guard
      operationId: getRealtime
      x-huakai-spec-source:
        - docs/03_FEATURE_PARITY_MATRIX.md
      description: |
        Placeholder runtime guard for F-RT-001. Full OpenAI Realtime-style
        WebSocket proxying, stream resume, and partial usage settlement remain a
        Phase 9+ mandatory roadmap item. Until that slice is released, the
        gateway returns a typed 501 response instead of an implicit 404.
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
  /v1/models:
    get:
      tags: [gateway]
      summary: OpenAI-compatible model discovery list
      operationId: listModels
      x-huakai-spec-source:
        - docs/process/plans/2026-04-30-n5-model-registry.md
      description: |
        Returns OpenAI-compatible model objects for public aliases that the
        authenticated tenant can route now: active alias, active model, and at
        least one enabled pool binding. Tenant-scoped disabled aliases block
        global inheritance just like chat request resolution.
      responses:
        '200':
          description: OpenAI-compatible model list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelsListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/generation:
    get:
      tags: [user-audit]
      summary: OpenRouter-compatible single generation usage lookup
      operationId: getGeneration
      x-huakai-spec-source:
        - docs/process/plans/2026-06-03-generation-endpoint-codex.md
        - backend/internal/meusagehttp/generation_handler.go
      description: |
        Returns the authenticated caller's own usage details for one request_id.
        Tenant and user scope come only from bearer auth; a missing record and a
        record owned by another user both return 404 so existence is not leaked.
        The response uses the same customer-safe projection as `/v1/me/usage`
        and does not expose tenant_id, api_key_id, user_id, prompts, bodies, or
        message payloads.
      parameters:
        - name: id
          in: query
          required: true
          description: Request id returned on the original gateway response.
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Caller-owned generation usage record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeUsageRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/media-tasks:
    post:
      tags: [media-tasks]
      summary: Submit an async media generation task
      operationId: createMediaTask
      x-huakai-spec-source:
        - docs/process/plans/2026-06-06-async-media-task-slice1-codex.md
        - backend/internal/mediataskhttp/handlers.go
      security:
        - sessionBearerAuth: []
      description: |
        Creates a long-running media generation task for the authenticated
        session user. The caller supplies a stable `request_id`; repeat submits
        with the same tenant and request_id return the existing task without a
        second balance reservation. When the media-task feature flag is disabled,
        the endpoint returns 404 and creates no task or reservation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaTaskSubmitRequest' }
      responses:
        '202':
          description: Task accepted for async provider submission and polling.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaTaskSubmitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
    get:
      tags: [media-tasks]
      summary: List the authenticated user's async media tasks
      operationId: listMediaTasks
      x-huakai-spec-source:
        - docs/process/plans/2026-06-06-async-media-task-slice1-codex.md
        - backend/internal/mediataskhttp/handlers.go
      security:
        - sessionBearerAuth: []
      description: |
        Lists only tasks owned by the authenticated tenant and user. Tenant,
        user, reservation, and provider-account internals are never exposed in
        the response body.
      responses:
        '200':
          description: Caller-owned async media tasks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaTaskListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/media-tasks/{id}:
    get:
      tags: [media-tasks]
      summary: Get async media task status
      operationId: getMediaTask
      x-huakai-spec-source:
        - docs/process/plans/2026-06-06-async-media-task-slice1-codex.md
        - backend/internal/mediataskhttp/handlers.go
      security:
        - sessionBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      description: |
        Returns status for one caller-owned task. A task owned by another tenant
        or user is indistinguishable from a missing task and returns 404.
      responses:
        '200':
          description: Caller-owned async media task status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/me/usage:
    get:
      tags: [user-audit]
      summary: End-user self-service consumption records
      operationId: listMyUsage
      x-huakai-spec-source:
        - docs/specs/observability-billing.md
        - docs/specs/trust-chain-user-verifiable-ledger.md
      description: |
        Returns immutable usage records for the authenticated inbound API key.
        Tenant and API-key scope are resolved from bearer auth; client-supplied
        tenant_id, api_key_id, or user_id query parameters are ignored and do
        not affect the server-side scope. Response records intentionally omit
        tenant_id, api_key_id, user_id, prompt, body, and message payloads.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as `next_cursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Auth-scoped consumption records for the caller's API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeUsageListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/me/usage/export.csv:
    get:
      tags: [user-audit]
      summary: Export my usage records
      operationId: exportMyUsageCSV
      x-huakai-spec-source:
        - docs/process/plans/2026-06-06-user-usage-export-codex.md
        - backend/internal/meexporthttp/handler.go
        - backend/internal/meusagehttp/handler.go
      description: |
        Read-only self-service export for the authenticated session user. The
        tenant and user scope come only from the validated session identity;
        tenant_id, api_key_id, and user_id query parameters are ignored and
        cannot widen the export. CSV string cells are guarded against
        spreadsheet formula injection, and exports are capped at 100000 rows
        with `X-Truncated: true` plus a trailing notice row when capped.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: format
          in: query
          required: false
          description: Defaults to CSV. `json` returns the same self-scoped export rows as JSON.
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        '200':
          description: Self-scoped usage export for the authenticated session user.
          headers:
            Content-Disposition:
              description: Attachment filename for CSV browser/download clients.
              schema: { type: string, example: 'attachment; filename="me-usage-export.csv"' }
            X-Truncated:
              description: Present and `true` when the export hit the row cap.
              schema: { type: string, enum: ['true'] }
          content:
            text/csv:
              schema: { type: string }
              example: |
                request_id,model,tokens_input,tokens_output,cost_usd,created_at,status
                req_123,claude-opus-4,12,34,0.00012345,2026-06-01T12:30:00Z,non_streaming
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        request_id: { type: string }
                        model: { type: string }
                        tokens_input: { type: integer, format: int32 }
                        tokens_output: { type: integer, format: int32 }
                        cost_usd: { type: string }
                        created_at: { type: string, format: date-time }
                        status: { type: string }
                  truncated: { type: boolean }
                  row_limit: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/me/analytics/time-series:
    get:
      tags: [user-audit]
      summary: End-user usage analytics time series
      operationId: getMyUsageTimeSeries
      x-huakai-spec-source:
        - backend/internal/usageanalyticshttp/handler.go
      description: |
        Returns UTC day, week, or month cost, token, and request-count totals
        grouped by requested_model for the authenticated inbound API key.
        Tenant and API-key scope come only from bearer auth; query parameters
        cannot widen the caller's scope. The window is required, RFC3339, and
        capped at 31 days by the runtime handler.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          required: false
          description: UTC bucket size; omitted keeps the historical daily response.
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        '200':
          description: Usage time-series rows for the caller's API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeUsageTimeSeriesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/admin/usage/overview:
    get:
      tags: [admin]
      summary: Platform-admin usage overview
      operationId: getAdminUsageOverview
      x-huakai-spec-source:
        - backend/internal/usageanalyticshttp/overview_handler.go
        - backend/cmd/gateway/routes_usageadmin.go
        - backend/sql/queries/usage_analytics.sql
      description: |
        Platform-admin (adminGate RBAC) read-only overview for global settled
        usage over a recent window. Totals include request count, actual_cost
        spend, input+output token total, distinct active users, distinct active
        API keys, and success rate where successful end classes are
        stream_end_graceful and non_streaming. The daily trend is UTC-day
        bucketed request count plus actual_cost spend, ordered oldest to newest.
        Window is required (e.g. 24h, 7d, 30d) and capped at 90 days.
      parameters:
        - name: window
          in: query
          required: true
          schema: { type: string, example: 7d }
      responses:
        '200':
          description: Platform-wide admin usage overview for the requested window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string }
                  totals:
                    type: object
                    properties:
                      requests: { type: integer, format: int64 }
                      total_cost: { type: string }
                      total_tokens: { type: integer, format: int64 }
                      active_users: { type: integer, format: int64 }
                      active_api_keys: { type: integer, format: int64 }
                      success_rate: { type: string }
                  trend:
                    type: array
                    items:
                      type: object
                      properties:
                        day: { type: string, format: date }
                        requests: { type: integer, format: int64 }
                        cost: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/admin/usage/export.csv:
    get:
      tags: [admin-usage]
