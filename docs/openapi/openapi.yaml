                  dispute: { $ref: '#/components/schemas/CostDispute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A dispute already exists for this tenant/user/request tuple.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/me/disputes:
