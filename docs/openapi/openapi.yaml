              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/conversations:
    get:
      tags: [hermes]
      summary: List Hermes conversations from PostgreSQL
      operationId: listHermesConversations
      description: Lists active tenant/user-scoped Hermes conversations from the gateway PostgreSQL store.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Gateway conversation list.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/conversations/{id}:
    get:
      tags: [hermes]
      summary: Get a Hermes conversation
      operationId: getHermesConversation
      description: Returns a tenant/user-owned Hermes conversation from the gateway PostgreSQL store.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Gateway conversation row.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Conversation was soft-deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
    delete:
      tags: [hermes]
      summary: Soft-delete a Hermes conversation
      operationId: deleteHermesConversation
      description: Soft-deletes a tenant/user-owned Hermes conversation and records `hermes.conversation.delete` audit evidence in the same transaction. Repeated deletes are idempotent.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Conversation is deleted or was already deleted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/conversations/{id}/messages:
    get:
      tags: [hermes]
      summary: List messages in a Hermes conversation
      operationId: listHermesConversationMessages
      description: Lists tenant/user-scoped conversation messages from the gateway PostgreSQL store.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Gateway conversation messages.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Conversation was soft-deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /internal/runner/bootstrap:
    post:
      tags: [hermes-internal]
      summary: Issue an initial Hermes runner JWT
      operationId: bootstrapHermesRunnerJWT
      description: >-
        Internal endpoint that issues a short-lived EdDSA JWT for a Hermes runner.
        Requires HMAC proof: X-Hermes-Signature, X-Hermes-Timestamp, X-Hermes-Tenant,
        X-Hermes-User computed over `<timestamp>\n<method>\n<path>\n<raw_query>\n<tenant>\n<user>\n`
        + body, signed with HUAKAI_HERMES_INTERNAL_SHARED_SECRET HMAC-SHA256.
      security: []
      parameters:
        - name: X-Hermes-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Tenant
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-User
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
