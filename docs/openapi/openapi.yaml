        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/admin/cache-price-overrides:
    get:
      tags: [admin-payments]
      summary: List cache-price override multipliers (global / per-model / per-tenant)
      operationId: adminListCachePriceOverrides
      x-huakai-required-role: platform_admin
      responses:
        '200':
          description: Current cache-price override multipliers. Scopes not listed bill at the official price (multiplier 1.0).
