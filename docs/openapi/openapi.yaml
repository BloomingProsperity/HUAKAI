        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
    post:
      tags: [admin-payments]
      summary: Create a pending payment order (idempotent by out_trade_no)
      operationId: adminCreatePaymentOrder
