              properties:
                tenant_id: { type: integer, format: int64, minimum: 1 }
                user_id: { type: integer, format: int64, minimum: 1 }
                amount_cents: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
                currency_code: { type: string, enum: [USD], default: USD }
                out_trade_no: { type: string, description: Caller-stable idempotency key; required so retries collapse instead of creating duplicate orders. }
                provider_kind: { type: string, enum: [manual, taobao, test] }
      responses:
        '201':
          description: Payment order created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { type: object }
                  idempotent: { type: boolean }
