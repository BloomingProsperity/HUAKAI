      summary: Dry-run validate stored Provider Account credentials
      operationId: testProviderAccountCredential
      description: |
        Runs a dry-run upstream credential validation against the provider account's currently stored
        encrypted credential material. This endpoint never returns credential fields, raw upstream
        response bodies, or secret-bearing error text, and it does not persist refresh results,
        health changes, retry counters, credential versions, or token rotations.

        Operational caution: this may call the upstream token/validation endpoint and can consume
        upstream quota or rate-limit budget. Use only for operator validation and troubleshooting.
