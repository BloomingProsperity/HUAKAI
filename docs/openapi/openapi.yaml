      x-huakai-spec-source: [docs/specs/upstream-credential-management.md]
      x-huakai-required-role: platform_admin_or_tenant_operator
      responses:
        '200':
          description: Dry-run validation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderAccountTestResponse' }
