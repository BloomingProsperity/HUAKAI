      operationId: listBillingClaims
      x-huakai-spec-source: [docs/specs/observability-billing.md]
      x-huakai-required-role: tenant_operator
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - name: status
          in: query
          schema: { type: string, enum: [reserving, committed, aborted] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated claims.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingLedgerClaimList' }

  /admin/v1/audit-events:
    get:
      tags: [admin-audit]
      summary: Query unified audit trail
      operationId: listAuditEvents
      description: |
        Unified view across pool_routing_audit_events + rate_limit_audit_events
        + oauth_refresh_audit_events. Filters by event_class / actor / time.
      x-huakai-spec-source:
        - docs/specs/pool-routing.md
        - docs/specs/rate-limiting.md
        - docs/specs/upstream-credential-management.md
      x-huakai-required-role: tenant_operator
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - name: event_class
          in: query
          schema:
            type: string
            enum: [pool_routing, rate_limit, oauth_refresh]
        - name: actor_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventList' }

  /admin/v1/dlq/{handler}:
    parameters:
      - name: handler
        in: path
        required: true
        schema:
          type: string
          enum: [usage_record, billing_event_replica, audit_event_replica, account_health, metrics]
    post:
      tags: [admin-dlq]
      summary: List DLQ entries by handler
      operationId: listObservabilityDLQ
      x-huakai-spec-source: [docs/specs/observability-billing.md]
      x-huakai-required-role: platform_admin
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, inflight, delivered, operator_review, dlq, quarantined]
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Matching DLQ entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DLQEntryList' }

  /admin/v1/dlq/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [admin-dlq]
      summary: Replay a generic DLQ entry
      operationId: replayObservabilityDLQ
      x-huakai-spec-source: [docs/specs/observability-billing.md]
      x-huakai-required-role: platform_admin
      responses:
        '200':
          description: Replay attempted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DLQReplayResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/v1/usage-record-dlq/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [admin-dlq]
      summary: Replay a DLQ entry
      operationId: replayUsageRecordDLQ
      x-huakai-spec-source: [docs/specs/observability-billing.md]
      x-huakai-required-role: platform_admin
      responses:
        '200':
          description: Replay attempted. Backward-compatible alias for generic DLQ replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DLQReplayResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

# ============================================================================
# Components
# ============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HUAKAI-API-KEY
    sessionBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HUAKAI-SESSION

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-supplied stable request id. Per docs/specs/observability-billing.md
        idempotency algorithm: server hashes (Idempotency-Key, tenant_id,
        api_key_id, payload, model, ...) into a settle-once claim. Replays
        with same fingerprint return the cached settled response.
      required: false
      schema: { type: string, maxLength: 128 }

    IdempotentStreamReplay:
      name: Idempotent-Stream-Replay
      in: header
      description: |
        Client opt-in for mid-stream failover after content has been emitted.
        Per docs/specs/streaming-forwarder.md §5.5 H6. Default false.
      required: false
      schema: { type: boolean }

    PageCursor:
      name: cursor
      in: query
      description: Opaque base64 cursor from prior page's `page.next_cursor`. Server-side TTL-bound.
      schema:
        type: [string, 'null']

    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Malformed or unsupported request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid HUAKAI API Key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PaymentRequired:
      description: |
        Quota exhausted or insufficient balance per F-OBS-001 Tx1 quota check.
        No Retry-After (recovery requires customer top-up, not timed retry).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: |
        Authorization failed (e.g. tenant_operator attempting platform_admin
        action per docs/specs/pool-routing.md §10 Q1).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found in caller's tenant scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: |
        Idempotency fingerprint mismatch per docs/specs/observability-billing.md
        (replay attack signal) OR DLQ replay conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Tenant-level OR Provider Account-level rate limit. Includes Retry-After.
      headers:
        Retry-After:
          description: Seconds until retry per F-RATE-001 H5 (jittered if HUAKAI-cooldown applied).
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceBusy:
      description: |
        All Provider Accounts unavailable (NO_ELIGIBLE_ACCOUNT) or Tx1 lock
        timeout. Includes Retry-After.
      headers:
        Retry-After:
          description: Estimated seconds until earliest Account recovery.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CredentialAcquisitionHelperCreated:
      description: Acquisition helper created one or more redacted flows.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CredentialAcquisitionHelperResponse' }

  schemas:
    AuthUser:
      type: object
      additionalProperties: false
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      required: [id, tenant_id, email, email_verified, status, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        display_name: { type: string }
        email_verified: { type: boolean }
        social_login_provider:
          type: [string, 'null']
          enum: [google, github, null]
        status:
          type: string
          enum: [pending_verification, active, disabled, locked, reset_required, deleted]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuthRegisterRequest:
      type: object
      additionalProperties: false
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      required: [tenant_id, email, password]
      properties:
        tenant_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        display_name: { type: string }
        password: { type: string, format: password, minLength: 8 }
        invite_code: { type: string }

    AuthLoginRequest:
      type: object
      additionalProperties: false
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      required: [tenant_id, email, password]
      properties:
        tenant_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        password: { type: string, format: password }
        device_info: { type: object, additionalProperties: true }

    AuthVerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, token]
      properties:
        tenant_id: { type: integer, format: int64 }
        token: { type: string }

    AuthResetPasswordRequest:
      type: object
      additionalProperties: false
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      required: [tenant_id]
      properties:
        tenant_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        token: { type: string }
        new_password: { type: string, format: password, minLength: 8 }

    AuthOAuthInitRequest:
      type: object
      additionalProperties: false
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      required: [tenant_id, provider]
      properties:
        tenant_id: { type: integer, format: int64 }
        provider: { type: string, enum: [google, github] }
        redirect_uri: { type: string, format: uri }

