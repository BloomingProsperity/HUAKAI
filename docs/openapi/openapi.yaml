      parameters:
        - name: by
          in: query
          required: false
          schema: { type: string, enum: [model, provider_account], default: model }
        - name: window
          in: query
          required: true
          schema: { type: string, example: 7d }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Ranked usage performance entries ordered by request_count desc.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string }
                  by: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: { type: integer }
