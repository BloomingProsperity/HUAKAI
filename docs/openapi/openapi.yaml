# HUAKAI OpenAPI 3.1 Contract — Phase 2.2 Lock (Synthesized)
# ============================================================================
# Synthesized from 3 independent drafts (Claude / Codex-gateway / Codex-admin)
# per Owner directive 'with Codex, repeated verification + review'.
# Synthesis decisions documented in SYNTHESIS.md (9 D-resolutions applied).
#
# CL-011: every component cites the Released spec(s) it derives from via
# x-huakai-spec-source extension.
# ============================================================================

openapi: 3.1.0

info:
  title: HUAKAI Gateway API
  version: 0.1.0-pre
  summary: Multi-tenant relay-station AI gateway with provider account pooling.
  description: |
    HUAKAI exposes three client-protocol-compatible relay endpoints (OpenAI Chat
    Completions, OpenAI Responses, Anthropic Messages) plus an operator admin
    API for managing Pool Groups, Provider Accounts, Routes, Usage Records,
    Billing Ledger, and Audit trails.

    Source-of-truth specs at `docs/specs/`. This file is the Phase 2.2
    contract lock; Phase 3 implementation skeleton derives from this contract
    via codegen.

    Per [DR-001](../process/decisions/DR-001-multi-tenancy.md), every endpoint is
    tenant-scoped; tenant is server-resolved from API Key. Cross-tenant data
    access is structurally rejected.

    JSON convention: snake_case throughout (matches OpenAI / Anthropic public
    APIs and HUAKAI database schema).

    Money fields: numeric(20, 8) precision; rendered as JSON string for
    client-side BigNumber safety.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://huakai.example/api
    description: Operator-deployed instance (URL operator-configured)

security:
  - bearerAuth: []

tags:
  - name: gateway
    description: Client-facing relay endpoints. F-GW-002 + F-PROTO-002 + F-AUTH-005.
  - name: hermes
    description: Optional Hermes assistant settings, profile management, and runner proxy endpoints.
  - name: hermes-internal
    description: Internal Hermes runner bootstrap, JWT refresh, and public-key sync endpoints.
  - name: auth
    description: HUAKAI platform User authentication. F-AUTH-007.
  - name: sessions
    description: HUAKAI platform User session management. F-SESSION-001.
  - name: invitations
    description: Authenticated User invitation code creation. F-COMM-001.
  - name: user-vouchers
    description: User voucher redemption. F-BILL-002.
  - name: user-audit
    description: User-facing cost receipt and detached receipt verification. F-AUDIT-001.
  - name: pricing
    description: Public historical pricing tables for client-side receipt validation. F-AUDIT-001 + F-BILL-001.
  - name: audit
    description: Public audit verification key material. F-TRUST-001 + F-AUDIT-001.
  - name: trust
    description: Public trust discovery and detached signature verification endpoints. F-TRUST-001 + F-AUDIT-001.
  - name: admin-vouchers
    description: Admin voucher creation, listing, batch creation, and revocation. F-BILL-002.
  - name: admin-email
    description: Tenant-scoped SMTP email delivery settings for F-AUTH-007.
  - name: admin-api-keys
    description: API Key issuance / list / revoke. Slice 2 N+4b2; backed by admin_tokens + admin_audit_events.
  - name: admin-pools
    description: Pool Group management. F-POOL-001.
  - name: admin-accounts
    description: Provider Account management. F-POOL-001 + F-AUTH-005 + F-RATE-001.
  - name: admin-channel-health
    description: Channel health state and operator audit visibility. F-CH-002 + F-PRIV-001.
  - name: admin-credential-acquisition
    description: Credential acquisition lifecycle and helper imports. F-CRED-001.
  - name: admin-usage
    description: Usage Record query. F-OBS-001.
  - name: admin-billing
    description: Billing Ledger query + adjustments. F-OBS-001.
  - name: admin-audit
    description: Audit trail query (rate-limit + pool-routing + oauth-refresh). F-RATE-001 + F-POOL-001 + F-AUTH-005.
  - name: admin-cache
    description: L2 response cache inspection and operator eviction. F-CACHE-002.
  - name: admin-dlq
    description: Usage Record DLQ replay. F-OBS-001.

paths:
  # ==========================================================================
  # Gateway endpoints (client-facing relay)
  # ==========================================================================

  /v1/chat/completions:
    post:
      tags: [gateway]
      summary: OpenAI Chat Completions compatible relay
      operationId: postChatCompletions
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md
        - docs/specs/protocol-translation.md
        - docs/specs/observability-billing.md
      description: |
        Accept OpenAI Chat Completions request, route to a Provider Account
        (F-POOL-001), translate via HUAKAI Canonical Stream Format (F-PROTO-002),
        return response (F-GW-002). Streaming via stream=true.

        Idempotency per F-OBS-001: when Idempotency-Key header is present, server
        derives idempotency_key from header + tenant_id + payload hash. Replays
        with same fingerprint return cached settled response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
      responses:
        '200':
          description: |
            Successful response. Content-Type is `application/json` for
            non-streaming or `text/event-stream` for streaming. SSE event
            types per F-PROTO-002 client adapter.
          headers:
            X-HUAKAI-Protocol-Loss:
              description: Comma-separated feature names that were LOSSY in this translation. Empty = fully PRESERVED. Full structured array also on Usage Record.
              schema: { type: string }
            X-HUAKAI-Idempotency-Hit:
              description: Present and 'true' when response is replayed from a settled prior claim with the same fingerprint.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SSEFrame'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/responses:
    post:
      tags: [gateway]
      summary: OpenAI Responses compatible relay
      operationId: postResponses
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md
        - docs/specs/protocol-translation.md
        - docs/specs/observability-billing.md
      description: |
        Same orchestration as `/v1/chat/completions` but client protocol is
        OpenAI Responses. Per F-PROTO-002 hub-and-spoke topology, both share
        the HUAKAI Canonical intermediate; only the client adapter differs.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsesRequest' }
      responses:
        '200':
          description: Successful response (json or SSE per stream flag).
          headers:
            X-HUAKAI-Protocol-Loss: { schema: { type: string } }
            X-HUAKAI-Idempotency-Hit: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsesResponse' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/SSEFrame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/messages:
    post:
      tags: [gateway]
      summary: Anthropic Messages compatible relay
      operationId: postAnthropicMessages
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md
        - docs/specs/protocol-translation.md
        - docs/specs/observability-billing.md
      description: |
        Anthropic Messages compatible client surface. Same hub-and-spoke
        orchestration as the OpenAI surfaces.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessagesRequest' }
      responses:
        '200':
          description: Successful response (json or SSE per stream flag).
          headers:
            X-HUAKAI-Protocol-Loss: { schema: { type: string } }
            X-HUAKAI-Idempotency-Hit: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicMessagesResponse' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/SSEFrame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/realtime:
    get:
      tags: [gateway]
      summary: Realtime WebSocket surface roadmap guard
      operationId: getRealtime
      x-huakai-spec-source:
        - docs/03_FEATURE_PARITY_MATRIX.md
      description: |
        Placeholder runtime guard for F-RT-001. Full OpenAI Realtime-style
        WebSocket proxying, stream resume, and partial usage settlement remain a
        Phase 9+ mandatory roadmap item. Until that slice is released, the
        gateway returns a typed 501 response instead of an implicit 404.
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
  /v1/models:
    get:
      tags: [gateway]
      summary: OpenAI-compatible model discovery list
      operationId: listModels
      x-huakai-spec-source:
        - docs/process/plans/2026-04-30-n5-model-registry.md
      description: |
        Returns OpenAI-compatible model objects for public aliases that the
        authenticated tenant can route now: active alias, active model, and at
        least one enabled pool binding. Tenant-scoped disabled aliases block
        global inheritance just like chat request resolution.
      responses:
        '200':
          description: OpenAI-compatible model list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelsListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/me/usage:
    get:
      tags: [user-audit]
      summary: End-user self-service consumption records
      operationId: listMyUsage
      x-huakai-spec-source:
        - docs/specs/observability-billing.md
        - docs/specs/trust-chain-user-verifiable-ledger.md
      description: |
        Returns immutable usage records for the authenticated inbound API key.
        Tenant and API-key scope are resolved from bearer auth; client-supplied
        tenant_id, api_key_id, or user_id query parameters are ignored and do
        not affect the server-side scope. Response records intentionally omit
        tenant_id, api_key_id, user_id, prompt, body, and message payloads.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as `next_cursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Auth-scoped consumption records for the caller's API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeUsageListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/settings:
    get:
      tags: [hermes]
      summary: Read Hermes settings for the authenticated user
      operationId: getHermesSettings
      description: Returns the caller's Hermes enablement state and selected API source.
      responses:
        '200':
          description: Current Hermes settings for the bearer-authenticated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: integer, format: int64 }
                  user_id: { type: integer, format: int64 }
                  enabled: { type: boolean }
                  api_source: { type: string }
                  profile_id: { type: integer, format: int64, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/settings/enable:
    post:
      tags: [hermes]
      summary: Enable Hermes for the authenticated user
      operationId: enableHermesSettings
      description: Enables Hermes with managed HUAKAI API access or a caller-owned dedicated profile.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                api_source: { type: string, enum: [managed_huakai_api, dedicated_group] }
                profile_id: { type: integer, format: int64, nullable: true }
      responses:
        '200':
          description: Hermes was enabled and the current settings are returned.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/settings/disable:
    post:
      tags: [hermes]
      summary: Disable Hermes for the authenticated user
      operationId: disableHermesSettings
      description: Disables new Hermes chats while preserving existing runner history for read endpoints.
      responses:
        '200':
          description: Hermes was disabled and the current settings are returned.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/chat:
    post:
      tags: [hermes]
      summary: Start a Hermes chat through the runner
      operationId: postHermesChat
      description: Proxies the authenticated user's chat body to the configured Hermes runner and streams the runner response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Runner response. Streaming deployments return Server-Sent Events.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/SSEFrame' }
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/conversations:
    get:
      tags: [hermes]
      summary: List Hermes conversations from PostgreSQL
      operationId: listHermesConversations
      description: Lists active tenant/user-scoped Hermes conversations from the gateway PostgreSQL store.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Gateway conversation list.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/conversations/{id}:
    get:
      tags: [hermes]
      summary: Get a Hermes conversation
      operationId: getHermesConversation
      description: Returns a tenant/user-owned Hermes conversation from the gateway PostgreSQL store.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Gateway conversation row.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Conversation was soft-deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
    delete:
      tags: [hermes]
      summary: Soft-delete a Hermes conversation
      operationId: deleteHermesConversation
      description: Soft-deletes a tenant/user-owned Hermes conversation and records `hermes.conversation.delete` audit evidence in the same transaction. Repeated deletes are idempotent.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Conversation is deleted or was already deleted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/conversations/{id}/messages:
    get:
      tags: [hermes]
      summary: List messages in a Hermes conversation
      operationId: listHermesConversationMessages
      description: Lists tenant/user-scoped conversation messages from the gateway PostgreSQL store.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Gateway conversation messages.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Conversation was soft-deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /internal/runner/bootstrap:
    post:
      tags: [hermes-internal]
      summary: Issue an initial Hermes runner JWT
      operationId: bootstrapHermesRunnerJWT
      description: >-
        Internal endpoint that issues a short-lived EdDSA JWT for a Hermes runner.
        Requires HMAC proof: X-Hermes-Signature, X-Hermes-Timestamp, X-Hermes-Tenant,
        X-Hermes-User computed over `<timestamp>\n<method>\n<path>\n<raw_query>\n<tenant>\n<user>\n`
        + body, signed with HUAKAI_HERMES_INTERNAL_SHARED_SECRET HMAC-SHA256.
      security: []
      parameters:
        - name: X-Hermes-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Tenant
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-User
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runner_id]
              properties:
                runner_id: { type: string, minLength: 1 }
                tenant_id: { type: integer, format: int64, minimum: 1 }
                actor_user_id: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Bootstrap JWT.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /internal/runner/refresh:
    post:
      tags: [hermes-internal]
      summary: Refresh a Hermes runner JWT
      operationId: refreshHermesRunnerJWT
      description: >-
        Internal endpoint that verifies an existing Hermes JWT and returns a replacement before expiry.
        Requires HMAC proof: X-Hermes-Signature, X-Hermes-Timestamp, X-Hermes-Tenant,
        X-Hermes-User computed over `<timestamp>\n<method>\n<path>\n<raw_query>\n<tenant>\n<user>\n`
        + body, signed with HUAKAI_HERMES_INTERNAL_SHARED_SECRET HMAC-SHA256.
      security: []
      parameters:
        - name: X-Hermes-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Tenant
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-User
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Refreshed JWT.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /internal/keys:
    get:
      tags: [hermes-internal]
      summary: List active Hermes JWT public keys
      operationId: listHermesRunnerJWTKeys
      description: >-
        Internal public-key sync endpoint for Hermes runner local verifier cache.
        Requires HMAC proof: X-Hermes-Signature, X-Hermes-Timestamp, X-Hermes-Tenant,
        X-Hermes-User computed over `<timestamp>\n<method>\n<path>\n<raw_query>\n<tenant>\n<user>\n`
        + body, signed with HUAKAI_HERMES_INTERNAL_SHARED_SECRET HMAC-SHA256.
      security: []
      parameters:
        - name: X-Hermes-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-Tenant
          in: header
          required: true
          schema: { type: string }
        - name: X-Hermes-User
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Active public keys.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [kid, alg, public_key_pem]
                      properties:
                        kid: { type: string }
                        alg: { type: string, enum: [EdDSA] }
                        public_key_pem: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/api-profiles:
    get:
      tags: [hermes]
      summary: List caller-owned Hermes API profiles
      operationId: listHermesAPIProfiles
      description: Lists API profiles the authenticated user may select for Hermes dedicated-group mode.
      responses:
        '200':
          description: Profile list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
    post:
      tags: [hermes]
      summary: Create a Hermes API profile
      operationId: createHermesAPIProfile
      description: Creates a caller-owned profile for managed or dedicated Hermes API routing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string, minLength: 1 }
                kind: { type: string, enum: [managed_huakai_api, dedicated_group] }
                api_key_id: { type: integer, format: int64, nullable: true }
                pool_group_id: { type: integer, format: int64, nullable: true }
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
