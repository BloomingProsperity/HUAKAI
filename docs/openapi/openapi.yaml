  # ==========================================================================
  # Admin: API Keys (Slice 2 N+4b2)
  # ==========================================================================

  /admin/v1/api-keys:
    post:
      tags: [admin-api-keys]
      summary: Issue a new API Key
      operationId: issueAPIKey
      description: |
        Mints a new tenant-scoped API Key. The plaintext bearer is returned
        ONCE in `plaintext_bearer` and never again — operators must capture
        it at issuance. Subsequent reads (LIST) return key_prefix only.
        Rate-limited to 30 issues/hour per admin token (D4).
      x-huakai-spec-source: [docs/specs/api-contract.md]
      x-huakai-required-role: tenant_operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/APIKeyCreate' }
      responses:
        '201':
          description: Key issued. plaintext_bearer shown ONCE.
          headers:
            X-Huakai-Key-Display:
              description: Always 'once-only' on success.
              schema: { type: string, enum: [once-only] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyIssued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
    get:
      tags: [admin-api-keys]
      summary: List API Keys for a tenant
      operationId: listAPIKeys
      description: |
        Returns API Key metadata (never plaintext, never key_hash). The
        tenant_id query param is required at L0 — full-fleet scans are
        deferred. Successful reads write a list_api_keys audit row.
      x-huakai-spec-source: [docs/specs/api-contract.md]
      x-huakai-required-role: tenant_operator
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /admin/v1/api-keys/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [admin-api-keys]
      summary: Revoke an API Key
      operationId: revokeAPIKey
      description: |
        Soft-revokes (status='revoked', revoked_at=now()). Idempotent:
        revoking an already-revoked key returns 200 with
        already_revoked=true. PATCH/DELETE intentionally deferred.
      x-huakai-spec-source: [docs/specs/api-contract.md]
      x-huakai-required-role: tenant_operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/APIKeyRevokeRequest' }
      responses:
        '200':
          description: Revoked (or already-revoked).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyRevokeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

