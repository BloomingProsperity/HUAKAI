  # ==========================================================================
  # Platform user auth/session endpoints
  # ==========================================================================

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register a HUAKAI platform User
      operationId: authRegister
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRegisterRequest' }
      responses:
        '201':
          description: User created; verification token is delivered through configured email sender. Dev mode may include `verification_token`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      operationId: authLogin
      x-huakai-spec-source: [docs/specs/user-authentication.md, docs/specs/session-management.md]
      security: []
      description: |
        Login failures are collapsed to a single generic 401 invalid_credentials regardless of cause
        (wrong password, unknown email, or disabled/locked/unverified/reset-required account), so the
        response never reveals whether an account exists or its state (account-enumeration safe, S2-048).
        The real reason is recorded only in the operator-visible audit log. Requests are rate-limited per
        client IP BEFORE any password hashing; throttled requests get 429 with a coarse Retry-After.
        When platform 2FA is enabled and the authenticated user has enabled TOTP, the password step
        returns a 202 challenge instead of issuing a session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthLoginRequest' }
      responses:
        '200':
          description: Authenticated user plus newly issued session tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '202':
          description: Password accepted, but a TOTP or backup-code challenge must be completed before a session is issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTwoFactorChallengeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/login/2fa:
    post:
      tags: [auth]
      summary: Complete password-login two-factor challenge
      operationId: authLoginTwoFactor
      x-huakai-spec-source:
        - backend/internal/gatewayhttp/auth_handler.go
        - backend/internal/twofa/service.go
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthTwoFactorLoginRequest' }
      responses:
        '200':
          description: Two-factor code accepted and platform session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionOnlyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/passkey/login/begin:
    post:
      tags: [auth]
      summary: Start discoverable passkey login
      operationId: authPasskeyLoginBegin
      x-huakai-spec-source:
        - backend/internal/passkeyhttp/handler.go
        - backend/internal/passkey/service.go
      security: []
      description: |
        Starts a WebAuthn discoverable-credential login ceremony using the configured RP ID and
        allowed origins. The challenge is stored server-side and expires after the configured TTL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyLoginBeginRequest' }
      responses:
        '201':
          description: PublicKeyCredentialRequestOptions plus server-side ceremony id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyBeginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/passkey/login/finish:
    post:
      tags: [auth]
      summary: Complete discoverable passkey login
      operationId: authPasskeyLoginFinish
      x-huakai-spec-source:
        - backend/internal/passkeyhttp/handler.go
        - backend/internal/passkey/service.go
        - docs/specs/session-management.md
      security: []
      description: |
        Consumes the server-side ceremony session exactly once, validates the authenticator
        assertion against configured RP/origin policy, rejects sign-count regression, and issues
        the same HUAKAI session token bundle used by password login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyLoginFinishRequest' }
      responses:
        '200':
          description: Authenticated user plus newly issued session tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Consume an email verification token
      operationId: authVerifyEmail
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthVerifyEmailRequest' }
      responses:
