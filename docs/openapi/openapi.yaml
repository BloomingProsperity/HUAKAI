# HUAKAI OpenAPI 3.1 Contract — Phase 2.2 Lock (Synthesized)
# ============================================================================
# Synthesized from 3 independent drafts (Claude / Codex-gateway / Codex-admin)
# per Owner directive 'with Codex, repeated verification + review'.
# Synthesis decisions documented in SYNTHESIS.md (9 D-resolutions applied).
#
# CL-011: every component cites the Released spec(s) it derives from via
# x-huakai-spec-source extension.
# ============================================================================

openapi: 3.1.0

info:
  title: HUAKAI Gateway API
  version: 0.1.0-pre
  summary: Multi-tenant relay-station AI gateway with provider account pooling.
  description: |
    HUAKAI exposes three client-protocol-compatible relay endpoints (OpenAI Chat
    Completions, OpenAI Responses, Anthropic Messages) plus an operator admin
    API for managing Pool Groups, Provider Accounts, Routes, Usage Records,
    Billing Ledger, and Audit trails.

    Source-of-truth specs at `docs/specs/`. This file is the Phase 2.2
    contract lock; Phase 3 implementation skeleton derives from this contract
    via codegen.

    Per [DR-001](../decisions/DR-001-multi-tenancy.md), every endpoint is
    tenant-scoped; tenant is server-resolved from API Key. Cross-tenant data
    access is structurally rejected.

    JSON convention: snake_case throughout (matches OpenAI / Anthropic public
    APIs and HUAKAI database schema).

    Money fields: numeric(20, 8) precision; rendered as JSON string for
    client-side BigNumber safety.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://huakai.example/api
    description: Operator-deployed instance (URL operator-configured)

security:
  - bearerAuth: []

tags:
  - name: gateway
    description: Client-facing relay endpoints. F-GW-002 + F-PROTO-002 + F-AUTH-005.
  - name: auth
    description: HUAKAI platform User authentication. F-AUTH-007.
  - name: sessions
    description: HUAKAI platform User session management. F-SESSION-001.
  - name: user-vouchers
    description: User voucher redemption. F-BILL-002.
  - name: user-audit
    description: User-facing cost receipt and detached receipt verification. F-AUDIT-001.
  - name: pricing
    description: Public historical pricing tables for client-side receipt validation. F-AUDIT-001 + F-BILL-001.
  - name: audit
    description: Public audit verification key material. F-TRUST-001 + F-AUDIT-001.
  - name: admin-vouchers
    description: Admin voucher creation, listing, batch creation, and revocation. F-BILL-002.
  - name: admin-email
    description: Tenant-scoped SMTP email delivery settings for F-AUTH-007.
  - name: admin-api-keys
    description: API Key issuance / list / revoke. Slice 2 N+4b2; backed by admin_tokens + admin_audit_events.
  - name: admin-pools
    description: Pool Group management. F-POOL-001.
  - name: admin-accounts
    description: Provider Account management. F-POOL-001 + F-AUTH-005 + F-RATE-001.
  - name: admin-channel-health
    description: Channel health state and operator audit visibility. F-CH-002 + F-PRIV-001.
  - name: admin-credential-acquisition
    description: Credential acquisition lifecycle and helper imports. F-CRED-001.
  - name: admin-usage
    description: Usage Record query. F-OBS-001.
  - name: admin-billing
    description: Billing Ledger query + adjustments. F-OBS-001.
  - name: admin-audit
    description: Audit trail query (rate-limit + pool-routing + oauth-refresh). F-RATE-001 + F-POOL-001 + F-AUTH-005.
  - name: admin-dlq
    description: Usage Record DLQ replay. F-OBS-001.

paths:
  # ==========================================================================
  # Gateway endpoints (client-facing relay)
  # ==========================================================================

  /v1/chat/completions:
    get:
      tags: [gateway]
      summary: OpenAI Chat Completions compatible relay
      operationId: postChatCompletions
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md
        - docs/specs/protocol-translation.md
        - docs/specs/observability-billing.md
      description: |
        Accept OpenAI Chat Completions request, route to a Provider Account
        (F-POOL-001), translate via HUAKAI Canonical Stream Format (F-PROTO-002),
        return response (F-GW-002). Streaming via stream=true.

        Idempotency per F-OBS-001: when Idempotency-Key header is present, server
        derives idempotency_key from header + tenant_id + payload hash. Replays
        with same fingerprint return cached settled response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
      responses:
        '200':
          description: |
            Successful response. Content-Type is `application/json` for
            non-streaming or `text/event-stream` for streaming. SSE event
            types per F-PROTO-002 client adapter.
          headers:
            X-HUAKAI-Protocol-Loss:
              description: Comma-separated feature names that were LOSSY in this translation. Empty = fully PRESERVED. Full structured array also on Usage Record.
              schema: { type: string }
            X-HUAKAI-Idempotency-Hit:
              description: Present and 'true' when response is replayed from a settled prior claim with the same fingerprint.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SSEFrame'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/responses:
    post:
      tags: [gateway]
      summary: OpenAI Responses compatible relay
      operationId: postResponses
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md
        - docs/specs/protocol-translation.md
        - docs/specs/observability-billing.md
      description: |
        Same orchestration as `/v1/chat/completions` but client protocol is
        OpenAI Responses. Per F-PROTO-002 hub-and-spoke topology, both share
        the HUAKAI Canonical intermediate; only the client adapter differs.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsesRequest' }
      responses:
        '200':
          description: Successful response (json or SSE per stream flag).
          headers:
            X-HUAKAI-Protocol-Loss: { schema: { type: string } }
            X-HUAKAI-Idempotency-Hit: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsesResponse' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/SSEFrame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/messages:
    post:
      tags: [gateway]
      summary: Anthropic Messages compatible relay
      operationId: postAnthropicMessages
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md
        - docs/specs/protocol-translation.md
        - docs/specs/observability-billing.md
      description: |
        Anthropic Messages compatible client surface. Same hub-and-spoke
        orchestration as the OpenAI surfaces.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessagesRequest' }
      responses:
        '200':
          description: Successful response (json or SSE per stream flag).
          headers:
            X-HUAKAI-Protocol-Loss: { schema: { type: string } }
            X-HUAKAI-Idempotency-Hit: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicMessagesResponse' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/SSEFrame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/receipts/{request_id}:
    get:
      tags: [user-audit]
      summary: Fetch a tenant-scoped signed cost receipt
      operationId: getCostReceipt
      x-huakai-spec-source: [docs/specs/user-consumption-transparency.md]
      security:
        - sessionBearerAuth: []
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Signed user-verifiable receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCostReceipt' }
        '202':
          description: Receipt facts exist but final usage is still unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/receipts/{request_id}/verify:
    post:
      tags: [user-audit]
      summary: Detached verification for a supplied receipt payload
      operationId: verifyCostReceipt
      x-huakai-spec-source: [docs/specs/user-consumption-transparency.md]
      security: []
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCostReceipt' }
      responses:
        '200':
          description: Verification verdict. This endpoint verifies supplied bytes only and does not look up request existence. When the signature is valid and a derived receipt mismatch is detected, the gateway can enqueue an audit_mismatch_refund DLQ event for asynchronous refund processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptVerifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: Receipt body exceeds the 10KB detached verification limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/pricing/rate-table:
    get:
      tags: [pricing]
      summary: Fetch a public historical rate table by version
      operationId: getPricingRateTable
      x-huakai-spec-source: [docs/specs/user-consumption-transparency.md, docs/specs/observability-billing.md]
      security: []
      parameters:
        - in: query
          name: version
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Historical rate table for client-side receipt validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateTable' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/pricing/snapshots:
    get:
      tags: [pricing]
      summary: List public historical pricing table versions
      operationId: listPricingSnapshots
      x-huakai-spec-source: [docs/specs/user-consumption-transparency.md, docs/specs/observability-billing.md]
      security: []
      responses:
        '200':
          description: Historical pricing versions retained for old receipt verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateTableSnapshotList' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/pricing/snapshots/{snapshot_id}:
    get:
      tags: [pricing]
      summary: Fetch a public historical pricing table by snapshot id
      operationId: getPricingSnapshot
      x-huakai-spec-source: [docs/specs/user-consumption-transparency.md, docs/specs/observability-billing.md]
      security: []
      parameters:
        - in: path
          name: snapshot_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Historical rate table for client-side receipt validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateTable' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/audit/pubkey:
    get:
      tags: [audit]
      summary: Fetch the current audit signing public key
      operationId: getAuditPubkey
      x-huakai-spec-source: [docs/specs/trust-chain-user-verifiable-ledger.md, docs/specs/user-consumption-transparency.md]
      security: []
      responses:
        '200':
          description: Current public key material for receipt and ledger verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPubkeyResponse' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  # ==========================================================================
  # Platform user auth/session endpoints
  # ==========================================================================

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register a HUAKAI platform User
      operationId: authRegister
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRegisterRequest' }
      responses:
        '201':
          description: User created; verification token is delivered through configured email sender. Dev mode may include `verification_token`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      operationId: authLogin
      x-huakai-spec-source: [docs/specs/user-authentication.md, docs/specs/session-management.md]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthLoginRequest' }
      responses:
        '200':
          description: Authenticated user plus newly issued session tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Consume an email verification token
      operationId: authVerifyEmail
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthVerifyEmailRequest' }
      responses:
        '200':
          description: Email verified and user activated when no other gate remains.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/reset-password:
    post:
      tags: [auth]
      summary: Request or complete password reset
      operationId: authResetPassword
      x-huakai-spec-source: [docs/specs/user-authentication.md, docs/specs/session-management.md]
      security: []
      description: |
        When `token` is omitted, requests a reset challenge using account-enumeration-safe output.
        When `token` and `new_password` are present, consumes the challenge, changes password, and revokes user sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthResetPasswordRequest' }
      responses:
        '200':
          description: Password reset completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUserResponse' }
        '202':
          description: Reset request accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResetRequestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/admin/email/settings:
    get:
      tags: [admin-email]
      summary: Read tenant SMTP email settings
      operationId: getAdminEmailSettings
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Current email settings. SMTP password value is masked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEmailSettingsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
    put:
      tags: [admin-email]
      summary: Upsert tenant SMTP email settings
      operationId: updateAdminEmailSettings
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminEmailSettingsUpdate' }
      responses:
        '200':
          description: Settings updated. SMTP password is encrypted at rest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEmailSettingsUpdateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/admin/email/test:
    post:
      tags: [admin-email]
      summary: Send a test email using tenant SMTP settings
      operationId: testAdminEmailSettings
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminEmailTestRequest' }
      responses:
        '200':
          description: Test email accepted by configured SMTP backend.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEmailTestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/oauth-init:
    post:
      tags: [auth]
      summary: Start Google/GitHub OAuth authorization flow
      operationId: authOAuthInit
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthOAuthInitRequest' }
      responses:
        '201':
          description: OAuth authorization URL plus opaque state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthOAuthInitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/auth/oauth-callback:
    post:
      tags: [auth]
      summary: Complete neutral Google/GitHub OAuth identity callback
      operationId: authOAuthCallback
      x-huakai-spec-source: [docs/specs/user-authentication.md, docs/specs/session-management.md]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthOAuthCallbackRequest' }
      responses:
        '200':
          description: Social identity accepted and platform session issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/sessions/refresh:
    post:
      tags: [sessions]
      summary: Rotate a refresh token and issue a new platform session token
      operationId: sessionRefresh
      x-huakai-spec-source: [docs/specs/session-management.md]
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRefreshRequest' }
      responses:
        '200':
          description: Refresh token rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/sessions/revoke:
    post:
      tags: [sessions]
      summary: Revoke one refresh token, one family, or all user session families
      operationId: sessionRevoke
      x-huakai-spec-source: [docs/specs/session-management.md]
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRevokeRequest' }
      responses:
        '200':
          description: Revocation applied.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/sessions/list:
    post:
      tags: [sessions]
      summary: List active and historical session families for a user
      operationId: sessionList
      x-huakai-spec-source: [docs/specs/session-management.md]
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionListRequest' }
      responses:
        '200':
          description: Session family list.
          content:
            application/json:
              schema:
                type: object
                required: [families]
                properties:
                  families:
                    type: array
                    items: { $ref: '#/components/schemas/SessionFamily' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/users/me/vouchers/redeem:
    post:
      tags: [user-vouchers]
      summary: Redeem a voucher into the authenticated User balance
      operationId: redeemVoucher
      x-huakai-spec-source: [docs/specs/voucher-system.md]
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoucherRedeemRequest' }
      responses:
        '200':
          description: Voucher redeemed or idempotent prior redemption returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherRedeemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/admin/vouchers:
    get:
      tags: [admin-vouchers]
      summary: List tenant vouchers
      operationId: listVouchers
      x-huakai-spec-source: [docs/specs/voucher-system.md]
      x-huakai-required-role: platform_admin
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: limit
