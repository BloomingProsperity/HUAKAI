  # ==========================================================================
  # Payments / Recharge (Slice P1) — 内部支付机器, 真实渠道 SDK 留 Owner-gated 后续
  # ==========================================================================

  /v1/users/me/payments/orders:
    get:
      tags: [user-payments]
      summary: List the authenticated User's payment orders
      operationId: listMyPaymentOrders
      x-huakai-spec-source: [docs/process/plans/2026-05-29-payment-p1-synthesis.md]
      security:
        - sessionBearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Caller's payment orders (newest first).
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
    post:
      tags: [user-payments]
      summary: Create a self-service top-up order for the authenticated User
      description: >-
        The amount must fall within the configured top-up range (server-side, not a
        client quote); order_kind is forced to topup and the out_trade_no is
        server-generated. Returns the order plus a manual/taobao payment instruction.
      operationId: createMyTopupOrder
      x-huakai-spec-source: [docs/process/plans/2026-06-02-payment-loop-slice-a-codex.md]
      security:
        - sessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents, provider]
              properties:
                amount_cents: { type: integer, format: int64, minimum: 1 }
                provider: { type: string, enum: [manual, taobao] }
      responses:
        '201':
          description: Pending top-up order created with payment instructions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { type: object }
                  idempotent: { type: boolean }
                  payment_instruction: { type: object }
        '200':
          description: Idempotent replay of an existing top-up order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { type: object }
                  idempotent: { type: boolean }
                  payment_instruction: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/users/me/payments/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [user-payments]
      summary: Get one of your own payment orders (for status polling)
      description: Ownership-checked; a cross-user order id resolves to 404, not another user's order.
      operationId: getMyPaymentOrder
      security:
        - sessionBearerAuth: []
      responses:
        '200':
          description: The caller's order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/users/me/payments/orders/{id}/refund-request:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [user-payments]
      summary: Request a refund for your own completed top-up order
      description: >-
        Records a pending refund request for admin approval. This never moves money;
        users cannot self-refund. Ownership-checked (cross-user id resolves to 404).
      operationId: requestMyPaymentRefund
      security:
        - sessionBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '202':
          description: Pending refund request recorded (awaiting admin approval).
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund_request: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/users/me/payments/config:
    get:
      tags: [user-payments]
      summary: Self-service top-up configuration (amount range + enabled providers)
      operationId: getMyPaymentPortalConfig
      security:
        - sessionBearerAuth: []
      responses:
        '200':
          description: Configured top-up amount range and enabled payment-instruction providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    properties:
                      min_topup_cents: { type: integer, format: int64 }
                      max_topup_cents: { type: integer, format: int64 }
                      currency_code: { type: string }
                      providers: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/users/me/payments/balance:
    get:
      tags: [user-payments]
      summary: Authenticated User's payment-source balance (derived SUM)
      operationId: getMyPaymentBalance
      x-huakai-spec-source: [docs/process/plans/2026-05-29-payment-p1-synthesis.md]
      security:
        - sessionBearerAuth: []
      responses:
        '200':
          description: Derived balance from payment credits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: object
                    properties:
                      tenant_id: { type: integer, format: int64 }
                      user_id: { type: integer, format: int64 }
                      amount_cents: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/users/me/payments/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
