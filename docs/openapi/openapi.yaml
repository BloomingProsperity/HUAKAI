    AuthSessionResponse:
      type: object
      additionalProperties: false
      x-huakai-spec-source: [docs/specs/user-authentication.md, docs/specs/session-management.md]
      required: [user, session]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
