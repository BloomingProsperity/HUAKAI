            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/settings/disable:
    post:
      tags: [hermes]
      summary: Disable Hermes for the authenticated user
