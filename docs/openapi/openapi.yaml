        session_policy: { type: string, enum: [revoked] }
        reason_class: { type: string }
        sessions_revoked: { type: integer, format: int64, minimum: 0 }

    AuthUserResponse:
      type: object
      additionalProperties: true
      x-huakai-spec-source: [docs/specs/user-authentication.md]
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
