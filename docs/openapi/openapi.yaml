        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/hermes/settings:
    get:
      tags: [hermes]
      summary: Read Hermes settings for the authenticated user
