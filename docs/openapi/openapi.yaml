    SessionTokenResponse:
      type: object
      additionalProperties: false
      x-huakai-spec-source: [docs/specs/session-management.md]
      required: [session]
      properties:
        session: { $ref: '#/components/schemas/SessionTokenBundle' }

    SessionTokenBundle:
      type: object
      additionalProperties: false
      x-huakai-spec-source: [docs/specs/session-management.md]
      required: [session_token, refresh_token, session_expires_at, refresh_expires_at, family, generation]
