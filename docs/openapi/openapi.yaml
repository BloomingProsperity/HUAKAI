        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialAcquisitionStart' }
      responses:
        '201':
          description: OAuth flow created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialAcquisitionStartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/v1/credentials/oauth-callback:
    get:
      tags: [admin-credential-acquisition]
      summary: Browser OAuth redirect callback
      operationId: oauthCallbackCredentialAcquisition
      x-huakai-spec-source: [docs/specs/credential-acquisition.md]
      x-huakai-required-role: platform_admin
      parameters:
        - name: flow_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Callback accepted and redacted status returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialAcquisitionStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ==========================================================================
  # Admin: Usage / Billing / Audit / DLQ (F-OBS-001)
  # ==========================================================================

  /admin/v1/usage:
    get:
      tags: [admin-usage]
      summary: Query Usage Records
      operationId: listUsageRecords
      x-huakai-spec-source: [docs/specs/observability-billing.md]
      x-huakai-required-role: tenant_operator
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: api_key_id
          in: query
          schema: { type: integer, format: int64 }
        - name: provider_account_id
          in: query
          schema: { type: integer, format: int64 }
        - name: model
          in: query
          schema: { type: string }
        - name: pending_reconciliation_only
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageRecordList' }

  /admin/v1/billing/claims:
    get:
      tags: [admin-billing]
