      security: []
      responses:
        '200':
          description: Active, rotated, and revoked signing keys for client-side receipt verification.
          headers:
            Cache-Control:
              description: Public cache policy for anonymous key discovery.
              schema:
                type: string
                examples:
                  - public, max-age=300, stale-while-revalidate=86400
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WellKnownPubkeyDocument' }
        '503':
          description: Signing key registry or revocation overlay unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustErrorResponse' }

  /v1/trust/verify:
    post:
      tags: [trust]
      summary: Verify a detached HUAKAI trust receipt signature
      operationId: verifyTrustReceiptSignature
      x-huakai-spec-source: [docs/specs/trust-chain-user-verifiable-ledger.md, docs/specs/user-consumption-transparency.md]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrustVerifyRequest' }
      responses:
        '200':
          description: Signature verification verdict. Missing required fields and malformed payloads return a negative verdict with status=missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustVerifyResponse' }
        '400':
          description: Request body could not be read or decoded before verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustErrorResponse' }
        '413':
          description: Request body exceeds the 10KB detached verification limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustErrorResponse' }
        '429':
          description: Anonymous trust verification rate limit exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustErrorResponse' }

