openapi: 3.1.0
info:
  title: HUAKAI Gateway Client API
  version: 0.1.0-codex-draft
  summary: Phase 2.2 Codex draft for client-facing gateway endpoints only.
  description: >
    HUAKAI API Key protected gateway contract for client protocol compatibility,
    streaming replay control, protocol-loss visibility, and durable usage
    settlement. This draft intentionally excludes admin APIs.
servers:
  - url: https://api.huakai.local
security:
  - bearerAuth: []
tags:
  - name: Gateway
    description: Client-facing gateway protocol surfaces.
paths:
  /v1/chat/completions:
    post:
      tags: [Gateway]
      summary: Create a HUAKAI chat completion.
      description: >
        Accepts the chat-style client protocol shape, routes through HUAKAI
        Gateway policy, and returns either a buffered JSON response or
        text/event-stream chunks. Usage settlement follows HUAKAI Tx1/Tx2
        accounting, and lossy protocol conversion is exposed explicitly.
      operationId: createChatCompletion
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md#f-gw-002-streaming-forwarder--usage-accounting
        - docs/specs/protocol-translation.md#f-proto-002-protocol-translation-across-provider-pairs
        - docs/specs/observability-billing.md#f-obs-001-observability--atomic-billing-settlement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
      responses:
        '200':
          description: Buffered or streaming chat completion result.
          headers:
            X-HUAKAI-Protocol-Loss:
              $ref: '#/components/headers/ProtocolLoss'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/responses:
    post:
      tags: [Gateway]
      summary: Create a HUAKAI response.
      description: >
        Accepts the response-style client protocol shape for multi-item input
        and output. HUAKAI records usage source, stream-end class, and protocol
        capability loss without hiding semantic conversion from clients or
        operators.
      operationId: createResponse
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md#f-gw-002-streaming-forwarder--usage-accounting
        - docs/specs/protocol-translation.md#f-proto-002-protocol-translation-across-provider-pairs
        - docs/specs/observability-billing.md#f-obs-001-observability--atomic-billing-settlement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: Buffered or streaming response result.
          headers:
            X-HUAKAI-Protocol-Loss:
              $ref: '#/components/headers/ProtocolLoss'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/messages:
    post:
      tags: [Gateway]
      summary: Create a HUAKAI message.
      description: >
        Accepts the message-style client protocol shape and returns either a
        buffered message result or protocol-compatible SSE. HUAKAI preserves
        tenant isolation, idempotent settlement, stream replay gating, and
        explicit protocol-loss reporting.
      operationId: createMessage
      x-huakai-spec-source:
        - docs/specs/streaming-forwarder.md#f-gw-002-streaming-forwarder--usage-accounting
        - docs/specs/protocol-translation.md#f-proto-002-protocol-translation-across-provider-pairs
        - docs/specs/observability-billing.md#f-obs-001-observability--atomic-billing-settlement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        '200':
          description: Buffered or streaming message result.
          headers:
            X-HUAKAI-Protocol-Loss:
              $ref: '#/components/headers/ProtocolLoss'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessagesResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HUAKAI_API_KEY
      description: HUAKAI API Key bearer token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Logical request key used by HUAKAI Tx1 claim creation. Reuse with the
        same request fingerprint returns the settled result without double
        charge; reuse with a different fingerprint returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IdempotentStreamReplay:
      name: Idempotent-Stream-Replay
      in: header
      required: false
      description: >
        When true, HUAKAI may replay a stream under the same idempotency claim
        for approved mid-stream recovery paths. Default behavior blocks
        mid-stream failover after client-visible content has been emitted.
      schema:
        type: boolean
        default: false
  headers:
    ProtocolLoss:
      description: Comma-separated HUAKAI capability names that were converted lossily.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the client should retry after quota, rate, or service-busy conditions.
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: Request is invalid or asks for an unsupported protocol capability.
      headers:
        X-HUAKAI-Protocol-Loss: { $ref: '#/components/headers/ProtocolLoss' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: HUAKAI API Key is missing, invalid, or disabled.
      headers:
        X-HUAKAI-Protocol-Loss: { $ref: '#/components/headers/ProtocolLoss' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PaymentRequired:
      description: Tx1 quota or balance reservation failed.
      headers:
        X-HUAKAI-Protocol-Loss: { $ref: '#/components/headers/ProtocolLoss' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Idempotency key was reused with a different request fingerprint.
      headers:
        X-HUAKAI-Protocol-Loss: { $ref: '#/components/headers/ProtocolLoss' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: HUAKAI or selected capacity is temporarily rate limited.
      headers:
        X-HUAKAI-Protocol-Loss: { $ref: '#/components/headers/ProtocolLoss' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Gateway is service-busy or no eligible capacity is currently available.
      headers:
        X-HUAKAI-Protocol-Loss: { $ref: '#/components/headers/ProtocolLoss' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ChatCompletionsRequest:
      x-huakai-spec-source: docs/specs/protocol-translation.md#phase-a-client-request--canonical
      type: object
      additionalProperties: true
      required: [model, messages]
      properties:
        model: { type: string, minLength: 1 }
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/MessageInput' }
        stream: { type: boolean, default: false }
        temperature: { type: number, minimum: 0 }
        max_tokens: { type: integer, minimum: 1 }
        tools:
          type: array
          items: { type: object, additionalProperties: true }
        response_format: { type: object, additionalProperties: true }
    ChatCompletionsResponse:
      x-huakai-spec-source: docs/specs/streaming-forwarder.md#phase-d-tx2-finalization
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items: { type: object, additionalProperties: true }
        usage: { $ref: '#/components/schemas/UsageBlock' }
        protocol_loss:
          type: array
          items: { $ref: '#/components/schemas/ProtocolLossEntry' }
    ResponsesRequest:
      x-huakai-spec-source: docs/specs/protocol-translation.md#phase-a-client-request--canonical
      type: object
      additionalProperties: true
      required: [model, input]
      properties:
        model: { type: string, minLength: 1 }
        input:
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/ContentItem' }
        instructions: { type: string }
        stream: { type: boolean, default: false }
        max_output_tokens: { type: integer, minimum: 1 }
        tools:
          type: array
          items: { type: object, additionalProperties: true }
        text: { type: object, additionalProperties: true }
    ResponsesResponse:
      x-huakai-spec-source: docs/specs/streaming-forwarder.md#phase-d-tx2-finalization
      type: object
      required: [id, object, created_at, model, output, usage]
      properties:
        id: { type: string }
        object: { type: string }
        created_at: { type: integer }
        model: { type: string }
        output:
          type: array
          items: { $ref: '#/components/schemas/ContentItem' }
        status: { type: string }
        usage: { $ref: '#/components/schemas/UsageBlock' }
        protocol_loss:
          type: array
          items: { $ref: '#/components/schemas/ProtocolLossEntry' }
    AnthropicMessagesRequest:
      x-huakai-spec-source: docs/specs/protocol-translation.md#phase-a-client-request--canonical
      type: object
      additionalProperties: true
      required: [model, max_tokens, messages]
      properties:
        model: { type: string, minLength: 1 }
        max_tokens: { type: integer, minimum: 1 }
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/MessageInput' }
        system:
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/ContentItem' }
        stream: { type: boolean, default: false }
        temperature: { type: number, minimum: 0 }
        tools:
          type: array
          items: { type: object, additionalProperties: true }
    AnthropicMessagesResponse:
      x-huakai-spec-source: docs/specs/streaming-forwarder.md#phase-d-tx2-finalization
      type: object
      required: [id, type, role, model, content, usage]
      properties:
        id: { type: string }
        type: { type: string }
        role: { type: string }
        model: { type: string }
        content:
          type: array
          items: { $ref: '#/components/schemas/ContentItem' }
        stop_reason: { type: string }
        usage: { $ref: '#/components/schemas/UsageBlock' }
        protocol_loss:
          type: array
          items: { $ref: '#/components/schemas/ProtocolLossEntry' }
    UsageBlock:
      x-huakai-spec-source: docs/specs/observability-billing.md#tx2--reconcile-transaction-after-upstream-resolution
      type: object
      additionalProperties: false
      properties:
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cache_creation_tokens: { type: integer, minimum: 0 }
        cache_read_tokens: { type: integer, minimum: 0 }
        usage_source:
          type: string
          enum: [reported, normalized, inferred, partial, ambiguous]
        end_class:
          type: string
          enum:
            - GRACEFUL
            - UPSTREAM_EOF_NO_TERMINAL
            - UPSTREAM_ERROR_4xx
            - UPSTREAM_ERROR_5xx
            - UPSTREAM_RATE_LIMIT
            - UPSTREAM_AUTH_FAILURE
            - FIRST_TOKEN_TIMEOUT
            - INTER_EVENT_TIMEOUT
            - TOTAL_STREAM_TIMEOUT
            - CLIENT_DISCONNECT
            - RESPONSE_EVENT_TOO_LARGE
            - ORCHESTRATOR_CANCEL
            - AMBIGUOUS_USAGE
            - UNKNOWN_TERMINATION
        pending_reconciliation: { type: boolean }
    ProtocolLossEntry:
      x-huakai-spec-source: docs/specs/protocol-translation.md#protocol_loss-field-on-usage-record
      type: object
      additionalProperties: false
      required: [feature, direction, verdict, note]
      properties:
        feature: { type: string }
        direction:
          type: string
          enum: [client_to_canonical, canonical_to_capacity, capacity_to_canonical, canonical_to_client]
        verdict:
          type: string
          enum: [LOSSY]
        note:
          type: string
          description: HUAKAI-domain explanation without external source identifiers.
    ErrorResponse:
      x-huakai-spec-source: docs/specs/observability-billing.md#failure-path
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication_failed
                - quota_exhausted
                - idempotency_conflict
                - rate_limited
                - service_busy
                - capacity_unavailable
            code:
              type: string
              examples: [FINGERPRINT_CONFLICT, UNSUPPORTED_REQUEST_FEATURE]
            message: { type: string }
            request_id: { type: string }
            retry_after_seconds: { type: integer, minimum: 0 }
            protocol_loss:
              type: array
              items: { $ref: '#/components/schemas/ProtocolLossEntry' }
    MessageInput:
      x-huakai-spec-source: docs/specs/protocol-translation.md#phase-a-client-request--canonical
      type: object
      additionalProperties: true
      required: [role, content]
      properties:
        role: { type: string }
        content:
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/ContentItem' }
    ContentItem:
      x-huakai-spec-source: docs/specs/protocol-translation.md#phase-a-client-request--canonical
      type: object
      additionalProperties: true
      properties:
        type: { type: string }
        text: { type: string }
    StreamEvent:
      x-huakai-spec-source: docs/specs/streaming-forwarder.md#phase-b-per-event-inline-processing
      type: string
      description: Server-sent event frame emitted by the selected client protocol adapter.
x-huakai-open-questions:
  - Should Retry-After be required on 402, or only present when quota reset timing is known?
  - Should protocol_loss appear in successful JSON bodies, headers only, or both for all client protocols?
  - Should stream event schemas remain string frames, or should Phase 2.3 define typed SSE event objects per protocol family?
  - Should request schemas stay permissive for public-client compatibility or become stricter before codegen lock?
x-huakai-owner-summary: >
  已创建 Codex 独立 gateway OpenAPI 草案，只覆盖 /v1/chat/completions、/v1/responses、/v1/messages 三个客户端入口；文件为 docs/openapi/codex-gateway-draft.yaml，引用 Released 的 streaming-forwarder、protocol-translation、observability-billing specs，包含 HUAKAI API Key 鉴权、幂等与流重放头、JSON/SSE 200 响应、400/401/402/409/429/503 错误、Protocol-Loss 与 Retry-After 响应头，以及 CL-011 要求的 schema 级 x-huakai-spec-source。功能没有缩水，未读取禁止的 Claude draft，clean-room 风险低；安全风险仅限草案阶段的契约细节待互审确认。Owner 需要确认 Retry-After 覆盖范围、protocol_loss 暴露位置、SSE typed schema 深度，以及 codegen 前是否收紧 public-client request shape。
