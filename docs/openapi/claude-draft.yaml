# HUAKAI OpenAPI Draft — Claude Independent Pass
# ============================================================================
# Phase 2.2 contract lock for the external HTTP surface.
# Authored independently of Codex's parallel pass per Owner directive.
# Mutual review + synthesis follow.
#
# CL-011: every non-trivial component cites the Released spec it derives from
# via comment and `x-huakai-spec-source` extension.
# ============================================================================

openapi: 3.1.0

info:
  title: HUAKAI Gateway API
  version: 0.1.0-pre
  summary: Multi-tenant relay-station AI gateway with provider account pooling.
  description: |
    HUAKAI exposes three client-protocol-compatible surfaces (OpenAI Chat
    Completions, OpenAI Responses, Anthropic Messages) plus an operator admin
    API for managing Pool Groups, Provider Accounts, Routes, Usage Records,
    Billing Ledger, and Audit trails.

    Source-of-truth specs are at `docs/specs/`. This file is the Phase 2.2
    contract lock; Phase 3 implementation skeleton derives from this contract.

    Per [DR-001], every endpoint is tenant-scoped (server-resolved from API Key);
    cross-tenant data access is structurally rejected.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://huakai.example/api
    description: Operator-deployed instance (URL is operator-configured)

security:
  - bearerAuth: []

tags:
  - name: gateway
    description: Client-facing relay endpoints. F-GW-002 + F-PROTO-002 + F-AUTH-005.
  - name: admin-pools
    description: Pool Group management. F-POOL-001.
  - name: admin-accounts
    description: Provider Account management. F-POOL-001 + F-AUTH-005 + F-RATE-001.
  - name: admin-usage
    description: Usage Record query. F-OBS-001.
  - name: admin-billing
    description: Billing Ledger query + adjustments. F-OBS-001.
  - name: admin-audit
    description: Audit trail query (rate-limit + pool-routing + oauth-refresh). F-RATE-001 + F-POOL-001 + F-AUTH-005.
  - name: admin-dlq
    description: Usage Record DLQ replay. F-OBS-001.

paths:
  # ==========================================================================
  # Gateway endpoints (client-facing relay)
  # ==========================================================================

  /v1/chat/completions:
    post:
      tags: [gateway]
      summary: OpenAI Chat Completions compatible relay
      description: |
        Accept an OpenAI Chat Completions request, route to a Provider Account,
        translate to upstream protocol, return OpenAI Chat Completions response.
        Supports streaming via stream=true (SSE).

        Per F-GW-002 §Phase A-D: request → Tx1 reservation → upstream call →
        Tx2 settlement (atomic with Usage Record + claim status + slot release).
        Per F-PROTO-002: protocol translation via HUAKAI Canonical Stream Format.
      x-huakai-spec-source: docs/specs/streaming-forwarder.md
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
      responses:
        '200':
          description: |
            Successful response. Content-Type is `application/json` for non-streaming
            (stream=false) or `text/event-stream` for streaming (stream=true).
            Streaming follows SSE per F-PROTO-002 §Phase D.
          headers:
            X-HUAKAI-Protocol-Loss:
              description: Comma-separated list of features that were LOSSY in this translation. Per F-PROTO-002. Empty header = fully preserved.
              schema: { type: string }
            X-HUAKAI-Routing-Reason:
              description: Optional structured routing summary (development debugging only; operator policy controls visibility).
              schema: { type: string }
            Retry-After:
              description: Present on 429 / 503; seconds until retry per F-RATE-001 H5.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
            text/event-stream:
              schema:
                type: string
                description: SSE stream. Event types per F-PROTO-002 client adapter (Chat Completions chunks).
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/responses:
    post:
      tags: [gateway]
      summary: OpenAI Responses compatible relay
      description: |
        Accept OpenAI Responses request; same orchestration as
        /v1/chat/completions but client protocol = OpenAI Responses.
      x-huakai-spec-source: docs/specs/streaming-forwarder.md
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: Successful response (json or SSE per stream flag).
          headers:
            X-HUAKAI-Protocol-Loss: { schema: { type: string } }
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsesResponse' }
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  /v1/messages:
    post:
      tags: [gateway]
      summary: Anthropic Messages compatible relay
      description: |
        Accept Anthropic Messages request; same orchestration but client
        protocol = Anthropic Messages.
      x-huakai-spec-source: docs/specs/streaming-forwarder.md
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IdempotentStreamReplay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        '200':
          description: Successful response (json or SSE per stream flag).
          headers:
            X-HUAKAI-Protocol-Loss: { schema: { type: string } }
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicMessagesResponse' }
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceBusy' }

  # ==========================================================================
  # Admin API: Pool Groups
  # ==========================================================================

  /admin/v1/pools:
    get:
      tags: [admin-pools]
      summary: List Pool Groups
      x-huakai-spec-source: docs/specs/pool-routing.md
      parameters:
        - $ref: '#/components/parameters/PaginationCursor'
        - $ref: '#/components/parameters/PaginationLimit'
      responses:
        '200':
          description: Paginated list of Pool Groups.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolGroupList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-pools]
      summary: Create Pool Group
      x-huakai-spec-source: docs/specs/pool-routing.md §10 Q1..Q4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoolGroupCreate' }
      responses:
        '201':
          description: Pool Group created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/pools/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [admin-pools]
      summary: Pool Group detail
      x-huakai-spec-source: docs/specs/pool-routing.md
      responses:
        '200':
          description: Pool Group detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolGroup' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin-pools]
      summary: Update Pool Group config
      x-huakai-spec-source: docs/specs/pool-routing.md §10
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoolGroupUpdate' }
      responses:
        '200':
          description: Pool Group updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # Admin API: Provider Accounts
  # ==========================================================================

  /admin/v1/provider-accounts:
    get:
      tags: [admin-accounts]
      summary: List Provider Accounts
      x-huakai-spec-source: docs/specs/pool-routing.md + upstream-credential-management.md + rate-limiting.md
      parameters:
        - $ref: '#/components/parameters/PaginationCursor'
        - $ref: '#/components/parameters/PaginationLimit'
        - name: pool_group_id
          in: query
          schema: { type: integer, format: int64 }
        - name: state_filter
          in: query
          description: Filter by Account state (active/error/disabled/rate_limited/overloaded/temp_unschedulable).
          schema: { type: string }
      responses:
        '200':
          description: Paginated list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderAccountList' }
    post:
      tags: [admin-accounts]
      summary: Create Provider Account
      x-huakai-spec-source: docs/specs/upstream-credential-management.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderAccountCreate' }
      responses:
        '201':
          description: Provider Account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/v1/provider-accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [admin-accounts]
      summary: Provider Account detail
      responses:
        '200':
          description: Provider Account detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderAccount' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin-accounts]
      summary: Update Provider Account
      x-huakai-spec-source: docs/specs/pool-routing.md + rate-limiting.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderAccountUpdate' }
      responses:
        '200':
          description: Provider Account updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/provider-accounts/{id}/clear-rate-limit:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [admin-accounts]
      summary: Cascade-clear rate-limit state
      description: |
        Clears rate_limit_reset_at + overload_until + temp_unschedulable_until
        + model_rate_limits + openai_403_counter atomically per F-RATE-001 §Phase F.
        Generates an audit event with actor_id = the admin user.
      x-huakai-spec-source: docs/specs/rate-limiting.md §Phase F
      responses:
        '204':
          description: Cleared.
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # Admin API: Usage / Billing / Audit
  # ==========================================================================

  /admin/v1/usage:
    get:
      tags: [admin-usage]
      summary: Query Usage Records
      x-huakai-spec-source: docs/specs/observability-billing.md
      parameters:
        - $ref: '#/components/parameters/PaginationCursor'
        - $ref: '#/components/parameters/PaginationLimit'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: api_key_id
          in: query
          schema: { type: integer, format: int64 }
        - name: provider_account_id
          in: query
          schema: { type: integer, format: int64 }
        - name: model
          in: query
          schema: { type: string }
        - name: pending_reconciliation_only
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated Usage Records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageRecordList' }

  /admin/v1/billing/claims:
    get:
      tags: [admin-billing]
      summary: Query Billing Ledger claims
      x-huakai-spec-source: docs/specs/observability-billing.md
      parameters:
        - $ref: '#/components/parameters/PaginationCursor'
        - $ref: '#/components/parameters/PaginationLimit'
        - name: status
          in: query
          schema: { type: string, enum: [reserving, committed, aborted] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated claims.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingLedgerClaimList' }

  /admin/v1/audit-events:
    get:
      tags: [admin-audit]
      summary: Query unified audit trail
      description: |
        Unifies pool_routing_audit_events + rate_limit_audit_events +
        oauth_refresh_audit_events. Filters by event_type / actor / time range.
      x-huakai-spec-source: docs/specs/pool-routing.md + rate-limiting.md + upstream-credential-management.md
      parameters:
        - $ref: '#/components/parameters/PaginationCursor'
        - $ref: '#/components/parameters/PaginationLimit'
        - name: event_class
          in: query
          schema: { type: string, enum: [pool_routing, rate_limit, oauth_refresh] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventList' }

  /admin/v1/usage-record-dlq/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [admin-dlq]
      summary: Replay a DLQ entry
      x-huakai-spec-source: docs/specs/observability-billing.md §H10
      responses:
        '204': { description: Replayed. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

# ============================================================================
# Components
# ============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HUAKAI-API-KEY

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-supplied stable request identity. Per F-OBS-001 idempotency
        algorithm: when present, becomes part of the claim idempotency_key;
        when absent, server derives a deterministic key from API Key + payload
        hash + 15-second time bucket.
      required: false
      schema: { type: string, maxLength: 128 }

    IdempotentStreamReplay:
      name: Idempotent-Stream-Replay
      in: header
      description: |
        When `true`, opt in to mid-stream failover after content has been
        emitted to client. Per F-GW-002 §5.5 H6. Client MUST handle replayed
        content without duplication.
      required: false
      schema: { type: boolean }

    PaginationCursor:
      name: cursor
      in: query
      schema: { type: string }

    PaginationLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Malformed or unsupported request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid API Key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PaymentRequired:
      description: Quota exhausted or insufficient balance per F-OBS-001 Tx1 quota check.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authorization failed (e.g. tenant_operator attempting platform-admin action per F-POOL-001 Q1).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found in the caller's tenant scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Idempotency fingerprint mismatch per F-OBS-001 (replay attack signal).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Tenant-level OR Account-level rate limit exceeded. Includes Retry-After.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceBusy:
      description: All Provider Accounts unavailable (NO_ELIGIBLE_ACCOUNT) or Tx1 lock timeout.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---- Gateway shared schemas (paraphrased from public OpenAI/Anthropic API; not from upstream source) ----

    ChatCompletionsRequest:
      type: object
      description: OpenAI Chat Completions request (HUAKAI accepts the public format).
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        stream: { type: boolean, default: false }
        max_tokens: { type: integer }
        temperature: { type: number }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ToolSpec' }
        tool_choice: { type: object }
        stream_options:
          type: object
          properties:
            include_usage: { type: boolean }

    ChatMessage:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [system, user, assistant, tool, function] }
        content: { description: 'Text or content-parts array.' }
        tool_calls: { type: array }
        tool_call_id: { type: string }

    ToolSpec:
      type: object
      properties:
        type: { type: string }
        function: { type: object }

    ChatCompletionsResponse:
      type: object
      required: [id, object, model, choices]
      properties:
        id: { type: string }
        object: { type: string, enum: [chat.completion] }
        model: { type: string }
        choices: { type: array, items: { type: object } }
        usage: { $ref: '#/components/schemas/UsageBlock' }

    ResponsesRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string }
        input: { description: 'String or array of input items.' }
        stream: { type: boolean, default: false }
        max_output_tokens: { type: integer }
        reasoning:
          type: object
          properties:
            effort: { type: string }
        tools: { type: array }

    ResponsesResponse:
      type: object
      required: [id, object, model, output, status]
      properties:
        id: { type: string }
        object: { type: string, enum: [response] }
        model: { type: string }
        output: { type: array }
        status: { type: string, enum: [completed, incomplete, failed] }
        incomplete_details: { type: object }
        usage: { $ref: '#/components/schemas/UsageBlock' }

    AnthropicMessagesRequest:
      type: object
      required: [model, messages, max_tokens]
      properties:
        model: { type: string }
        messages: { type: array, items: { type: object } }
        system: { description: 'String or array of system blocks.' }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
        tools: { type: array }

    AnthropicMessagesResponse:
      type: object
      required: [id, type, model, content]
      properties:
        id: { type: string }
        type: { type: string }
        model: { type: string }
        content: { type: array }
        stop_reason: { type: string }
        usage: { $ref: '#/components/schemas/UsageBlock' }

    UsageBlock:
      type: object
      description: Token counts per the client protocol's usage shape (same fields exposed across all 3 client formats).
      properties:
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cache_creation_input_tokens: { type: integer }
        cache_read_input_tokens: { type: integer }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type: { type: string, description: 'HUAKAI typed error class.' }
            message: { type: string }
            code: { type: string }
            details: { type: object }

    # ---- Admin API schemas ----

    PoolGroup:
      type: object
      x-huakai-spec-source: docs/specs/pool-routing.md
      required: [id, tenant_id, name, routing_policy_version]
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64 }
        name: { type: string }
        routing_policy_version: { type: string }
        top_k_default: { type: integer, minimum: 1, maximum: 10 }
        capability_default: { type: string, enum: [exact_capability_only, safe_equivalent_allowed] }
        allow_tenant_operator_force: { type: boolean }
        allow_last_resort: { type: boolean }
        sticky_wait_max_waiting: { type: integer }
        fallback_wait_max_waiting: { type: integer }
        sticky_wait_timeout_ms: { type: integer }
        fallback_wait_timeout_ms: { type: integer }
        forced_route_rate_limit_per_hour: { type: integer }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PoolGroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        routing_policy_version: { type: string, default: '1.0' }
        top_k_default: { type: integer, default: 1 }
        capability_default: { type: string, default: exact_capability_only }
        allow_tenant_operator_force: { type: boolean, default: false }
        allow_last_resort: { type: boolean, default: false }

    PoolGroupUpdate:
      type: object
      properties:
        routing_policy_version: { type: string }
        top_k_default: { type: integer }
        capability_default: { type: string }
        allow_tenant_operator_force: { type: boolean }
        allow_last_resort: { type: boolean }
        sticky_wait_max_waiting: { type: integer }
        fallback_wait_max_waiting: { type: integer }
        forced_route_rate_limit_per_hour: { type: integer }
        enabled: { type: boolean }

    PoolGroupList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PoolGroup' } }
        next_cursor: { type: string, nullable: true }

    ProviderAccount:
      type: object
      x-huakai-spec-source: docs/specs/pool-routing.md + upstream-credential-management.md + rate-limiting.md
      required: [id, tenant_id, provider_id, channel_id, name, account_type]
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        channel_id: { type: integer, format: int64 }
        name: { type: string }
        account_type: { type: string, enum: [oauth, api_key, service_account, upstream_static] }
        enabled: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        health_state: { type: string, enum: [operational, degraded, failed, cooling_down, error] }
        credential_state: { type: string, enum: [valid, refreshing, refreshing_with_grace, refresh_failed, revoked] }
        cap_concurrency: { type: integer }
        in_flight_count: { type: integer }
        priority: { type: integer }
        last_dispatch_at: { type: string, format: date-time, nullable: true }
        model_allow_list: { type: array, items: { type: string } }
        capability_flags: { type: array, items: { type: string } }
        # Cooldown state (F-RATE-001)
