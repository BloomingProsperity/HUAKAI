<!DOCTYPE html><html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:18px}
  .row{display:flex;gap:0}
  .sw{flex:1;height:84px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;font-family:var(--font-mono)}
  .sw:first-child{border-radius:8px 0 0 8px}.sw:last-child{border-radius:0 8px 8px 0}
  .meta{display:flex;gap:0;margin-top:6px}
  .meta span{flex:1;text-align:center;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--primary-50);color:#0f766e">50</div>
  <div class="sw" style="background:var(--primary-100);color:#0f766e">100</div>
  <div class="sw" style="background:var(--primary-200);color:#0f766e">200</div>
  <div class="sw" style="background:var(--primary-300);color:#0f766e">300</div>
  <div class="sw" style="background:var(--primary-400);color:#042f2e">400</div>
  <div class="sw" style="background:var(--primary-500);color:#fff">500</div>
  <div class="sw" style="background:var(--primary-600);color:#fff">600</div>
  <div class="sw" style="background:var(--primary-700);color:#fff">700</div>
  <div class="sw" style="background:var(--primary-800);color:#fff">800</div>
  <div class="sw" style="background:var(--primary-900);color:#5eead4">900</div>
  <div class="sw" style="background:var(--primary-950);color:#5eead4">950</div>
</div>
<div class="meta"><span>#14b8a6 = primary-500 · brand teal · focus ring, active nav, logo, glow</span></div>
</body></html>
