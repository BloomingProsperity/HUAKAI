<!-- @dsCard group="Type" viewport="700x180" name="Type scale" subtitle="System sans stack — page titles, body, meta" -->
<!DOCTYPE html><html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:20px;color:var(--text-body)}
  .r{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px solid var(--border)}
  .r:last-child{border-bottom:0}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);width:128px;flex-shrink:0}
</style></head><body>
  <div class="r"><span class="tag">2xl · 700</span><span style="font-size:24px;font-weight:700;color:var(--text-strong)">运营总览 Operations</span></div>
  <div class="r"><span class="tag">lg · 600</span><span style="font-size:18px;font-weight:600;color:var(--text-strong)">供应商账号 Panel title</span></div>
  <div class="r"><span class="tag">sm · 400</span><span style="font-size:14px">真实后端账号池健康、成本与缓存效率集中视图</span></div>
  <div class="r"><span class="tag">xs · 600 ↑</span><span style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)">Table Header / Eyebrow</span></div>
  <div class="r"><span class="tag">xs · 400</span><span style="font-size:12px;color:var(--text-muted)">辅助说明 secondary meta text</span></div>
</body></html>
