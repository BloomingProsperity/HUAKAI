<!-- @dsCard group="Brand" viewport="700x170" name="HK monogram & logo lockup" subtitle="Teal rounded-square monogram with glow, 控制台 lockup" -->
<!DOCTYPE html><html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:22px;color:var(--text-body);display:flex;gap:40px;align-items:center;flex-wrap:wrap}
  .mono{width:48px;height:48px;border-radius:10px;background:var(--primary-500);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;box-shadow:var(--shadow-glow)}
  .lock{display:flex;align-items:center;gap:12px}
  .name{font-size:18px;font-weight:700;color:var(--text-strong)}
  .sub{font-size:12px;color:var(--text-muted)}
  .swatch{width:56px;height:56px;border-radius:10px}
  .cap{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px}
</style></head><body>
  <div class="lock">
    <div class="mono">HK</div>
    <div><div class="name">HUAKAI 华凯</div><div class="sub">AI Gateway · 控制台</div></div>
  </div>
  <div style="text-align:center"><div class="mono" style="width:56px;height:56px;font-size:18px">HK</div><div class="cap">monogram</div></div>
  <div style="text-align:center"><div class="swatch" style="background:var(--primary-500)"></div><div class="cap">#14b8a6</div></div>
</body></html>
