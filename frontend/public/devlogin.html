<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>HUAKAI · 免密进入(dev)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:#f3f5f7; color:#202a36; display:grid; place-items:center; height:100vh; }
    .box { background:#fff; border:1px solid #e6e9ed; border-radius:12px; padding:28px 32px;
      box-shadow:0 1px 3px rgba(24,34,48,.08); text-align:center; max-width:360px; }
    .mark { width:40px; height:40px; border-radius:10px; margin:0 auto 14px;
      background:linear-gradient(150deg,#2fb871,#157a4a); color:#fff; display:grid; place-items:center;
      font-weight:800; font-size:20px; }
    h1 { font-size:16px; margin:0 0 6px; }
    p { color:#66717f; font-size:13px; margin:6px 0; }
    .err { color:#de4b47; }
    .spin { width:22px; height:22px; border:3px solid #cdebdc; border-top-color:#21a566;
      border-radius:50%; margin:14px auto 0; animation:s 0.8s linear infinite; }
    @keyframes s { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">华</div>
    <h1>HUAKAI 运营台 · 免密进入</h1>
    <p id="msg">正在自动登录…</p>
    <div class="spin" id="spin"></div>
  </div>
  <script>
    // 仅 dev:用本机 admin 号自动登录,把会话写入 localStorage 后跳进运营台。无需手输账号密码。
    (async function () {
      var msg = document.getElementById('msg');
      var spin = document.getElementById('spin');
      try {
        var r = await fetch('/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tenant_id: 1, email: 'admin@huakai.ai', password: 'Huakai#2026dev' }),
        });
        if (!r.ok) throw new Error('登录失败 HTTP ' + r.status);
        var d = await r.json();
        var s = d.session || {};
        localStorage.setItem('hk_session_token', s.session_token || '');
        localStorage.setItem('hk_refresh_token', s.refresh_token || '');
        localStorage.setItem('hk_session_expiry', s.session_expires_at || '');
        if (d.user) localStorage.setItem('hk_user', JSON.stringify(d.user));
        msg.textContent = '登录成功,正在进入…';
        location.replace('/overview');
      } catch (e) {
        spin.style.display = 'none';
        msg.className = 'err';
        msg.textContent = '自动登录失败:' + e.message + '(确认后端网关在跑)';
      }
    })();
  </script>
</body>
</html>
