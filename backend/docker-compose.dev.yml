# HUAKAI dev-time PostgreSQL for integration tests + local manual run.
# Production deploys use a managed PG; this file is dev-only.
#
# Usage:
#   make db-up         # start container, wait for ready
#   make db-migrate    # apply sql/migrations/*.up.sql
#   make db-reset      # drop volume + restart
#   make db-down       # stop container (preserve volume)
#
# DSN for code: postgres://huakai:huakai@localhost:5432/huakai?sslmode=disable
# gateway 本地手动运行时,quota reconciler 默认启用;如需临时停用,在启动 gateway
# 前显式设置 HUAKAI_QUOTA_RECONCILER_ENABLED=false 或 0。
# gateway 本地手动运行时,告警规则评估器默认启用(unset/非法值均按 true);无告警规则时空转 no-op。
# dev 便于本地联调;需临时停用才设 HUAKAI_ALERTING_EVAL_ENABLED=false 或 0。
# gateway 本地手动运行时,内容审核执行器默认启用(unset/非法值均按 true);租户级审核配置默认 Enabled=false。
# 未在 admin 面显式开启审核的租户仍放行;整机临时停用才设 HUAKAI_CONTENT_MODERATION_ENABLED=false 或 0。

services:
  postgres:
    image: postgres:16-alpine
    container_name: huakai-dev-pg
    environment:
      POSTGRES_USER: huakai
      POSTGRES_PASSWORD: huakai
      POSTGRES_DB: huakai
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - huakai-pgdata:/var/lib/postgresql/data
    networks:
      - huakai-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huakai -d huakai"]
      interval: 2s
      timeout: 3s
      retries: 30

  hermes-runner:
    build:
      context: ./deploy/hermes-runner
    container_name: huakai-hermes-runner
    depends_on:
      hermes-egress:
        condition: service_healthy
      hermes-key-init:
        condition: service_completed_successfully
    environment:
      HUAKAI_HERMES_JWT_PUBLIC_KEY_PATH: /run/secrets/hermes/public.pem
      HUAKAI_HERMES_JWT_KID: ${HUAKAI_HERMES_JWT_KID:-dev-local}
      HUAKAI_HERMES_MCP_URL: http://host.docker.internal:8080/internal/hermes/mcp
      HUAKAI_HERMES_EGRESS_PROXY_URL: http://hermes-egress:8080
      HUAKAI_HERMES_RUNNER_BIND: 0.0.0.0:8801
      HUAKAI_HERMES_MAX_CONCURRENCY: ${HUAKAI_HERMES_MAX_CONCURRENCY:-1}
      HUAKAI_HERMES_QUEUE_TIMEOUT_SECONDS: ${HUAKAI_HERMES_QUEUE_TIMEOUT_SECONDS:-10}
      HUAKAI_HERMES_PROCESS_TIMEOUT_SECONDS: ${HUAKAI_HERMES_PROCESS_TIMEOUT_SECONDS:-240}
    ports:
      - "8801:8801"
    volumes:
      - huakai-hermes-public-key:/run/secrets/hermes:ro
    read_only: true
    tmpfs:
      - /run/huakai-hermes:rw,noexec,nosuid,nodev,size=128m,uid=10101,gid=10101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.0
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - huakai-dev
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8801/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  hermes-egress:
    build:
      context: ./deploy/hermes-runner
    container_name: huakai-hermes-egress
    entrypoint: ["/usr/bin/tini", "--", "python3", "/app/egress_proxy.py"]
    environment:
      HUAKAI_HERMES_EGRESS_BIND: 0.0.0.0:8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    networks:
      - huakai-dev
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # runner 固定使用非 root UID；先把宿主公钥复制到对应属主的受控卷，宿主密钥
  # 目录继续保持严格权限。
  hermes-key-init:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -f /runner/public.pem /runner/public.pem.new
        if [ ! -f /source/public.pem ]; then
          exit 0
        fi
        umask 077
        cp /source/public.pem /runner/public.pem.new
        chown 10101:10101 /runner/public.pem.new
        chmod 0400 /runner/public.pem.new
        mv /runner/public.pem.new /runner/public.pem
    volumes:
      - ${HUAKAI_HERMES_KEYS_HOST_DIR:-./deploy/hermes-runner/dev-keys}:/source:ro
      - huakai-hermes-public-key:/runner
    networks:
      - huakai-dev

# Explicit network name avoids the `<project-name>_default` fragility
# when COMPOSE_PROJECT_NAME / `-p` differs from the default 'backend'.
networks:
  huakai-dev:
    name: huakai-dev-net

volumes:
  huakai-pgdata:
  huakai-hermes-public-key:
