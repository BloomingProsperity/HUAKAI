# HUAKAI dev-time PostgreSQL for integration tests + local manual run.
# Production deploys use a managed PG; this file is dev-only.
#
# Usage:
#   make db-up         # start container, wait for ready
#   make db-migrate    # apply sql/migrations/*.up.sql
#   make db-reset      # drop volume + restart
#   make db-down       # stop container (preserve volume)
#
# DSN for code: postgres://huakai:huakai@localhost:5432/huakai?sslmode=disable
# gateway 本地手动运行时,quota reconciler 默认启用;如需临时停用,在启动 gateway
# 前显式设置 HUAKAI_QUOTA_RECONCILER_ENABLED=false 或 0。
# gateway 本地手动运行时,告警规则评估器默认启用(unset/非法值均按 true);无告警规则时空转 no-op。
# dev 便于本地联调;需临时停用才设 HUAKAI_ALERTING_EVAL_ENABLED=false 或 0。
# gateway 本地手动运行时,内容审核执行器默认启用(unset/非法值均按 true);租户级审核配置默认 Enabled=false。
# 未在 admin 面显式开启审核的租户仍放行;整机临时停用才设 HUAKAI_CONTENT_MODERATION_ENABLED=false 或 0。

services:
  postgres:
    image: postgres:16-alpine
    container_name: huakai-dev-pg
    environment:
      POSTGRES_USER: huakai
      POSTGRES_PASSWORD: huakai
      POSTGRES_DB: huakai
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - huakai-pgdata:/var/lib/postgresql/data
    networks:
      - huakai-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huakai -d huakai"]
      interval: 2s
      timeout: 3s
      retries: 30

  hermes-runner:
    build:
      context: ./deploy/hermes-runner
    container_name: huakai-hermes-runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUAKAI_HERMES_JWT_PUBLIC_KEY_PATH: /run/secrets/hermes/dev_jwt_public.pem
      HUAKAI_HERMES_JWT_KID: ${HUAKAI_HERMES_JWT_KID:-dev-local}
      HUAKAI_HERMES_INTERNAL_SHARED_SECRET: ${HUAKAI_HERMES_INTERNAL_SHARED_SECRET:-dev-internal-runner-secret-change-me}
      HUAKAI_HERMES_RUNNER_BIND: 0.0.0.0:8801
    ports:
      - "8801:8801"
    volumes:
      - huakai-hermes-data:/var/lib/huakai/hermes
      - ./deploy/hermes-runner/dev-keys/dev_jwt_public.pem:/run/secrets/hermes/dev_jwt_public.pem:ro
    networks:
      - huakai-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8801/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# Explicit network name avoids the `<project-name>_default` fragility
# when COMPOSE_PROJECT_NAME / `-p` differs from the default 'backend'.
networks:
  huakai-dev:
    name: huakai-dev-net

volumes:
  huakai-pgdata:
  huakai-hermes-data:
