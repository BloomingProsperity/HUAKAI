# HUAKAI production docker-compose.
# DO NOT use for local dev — use docker-compose.dev.yml instead.
#
# Required env vars (set in .env or shell before running):
#   HUAKAI_DATABASE_URL              - PostgreSQL DSN (passed through to gateway)
#   HUAKAI_CREDENTIAL_KEY_B64        - 32-byte base64 encryption key
#   HUAKAI_SESSION_SIGNING_KEY_B64   - JWT session signing key (base64), OR
#   HUAKAI_SESSION_SIGNING_KEY_HEX   - JWT session signing key (hex, >=32 bytes)
#   HUAKAI_ADMIN_BOOTSTRAP_TOKEN     - one-time bootstrap admin token (rotate after first use)
#   HUAKAI_RELEASE_MODE              - must be: production
#   POSTGRES_PASSWORD                - postgres superuser password
#
# Usage:
#   HUAKAI_DATABASE_URL=postgres://huakai:secret@postgres:5432/huakai?sslmode=disable #   HUAKAI_CREDENTIAL_KEY_B64=... HUAKAI_SESSION_SIGNING_KEY_B64=... #   HUAKAI_ADMIN_BOOTSTRAP_TOKEN=... HUAKAI_RELEASE_MODE=production #   POSTGRES_PASSWORD=secret #   docker compose -f docker-compose.prod.yml up -d

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HUAKAI_DATABASE_URL: ${HUAKAI_DATABASE_URL}
      HUAKAI_CREDENTIAL_KEY_B64: ${HUAKAI_CREDENTIAL_KEY_B64}
      HUAKAI_SESSION_SIGNING_KEY_B64: ${HUAKAI_SESSION_SIGNING_KEY_B64:-}
      HUAKAI_SESSION_SIGNING_KEY_HEX: ${HUAKAI_SESSION_SIGNING_KEY_HEX:-}
      HUAKAI_ADMIN_BOOTSTRAP_TOKEN: ${HUAKAI_ADMIN_BOOTSTRAP_TOKEN}
      HUAKAI_RELEASE_MODE: ${HUAKAI_RELEASE_MODE}
      # production 模式硬要求:审计账本持久化到 postgres + 持久 ed25519 私钥签名
      # (缺任一启动 fail-loud 拒启)。私钥由运维用 `openssl genpkey -algorithm ed25519`
      # 生成后挂载到容器内固定路径;切勿提交私钥进仓库。
      HUAKAI_AUDIT_LEDGER_BACKEND: ${HUAKAI_AUDIT_LEDGER_BACKEND:-postgres}
      HUAKAI_AUDIT_PRIVATE_KEY_PATH: /run/secrets/audit/key.pem
    volumes:
      # 运维在宿主生成 ed25519 私钥并经 HUAKAI_AUDIT_PRIVATE_KEY_HOST 指向它
      # (默认 ./secrets/audit_key.pem);只读挂载,容器内路径与上面 env 对应。
      - ${HUAKAI_AUDIT_PRIVATE_KEY_HOST:-./secrets/audit_key.pem}:/run/secrets/audit/key.pem:ro
    networks:
      - huakai-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # 一次性数据库迁移。gateway 刻意不自管迁移(保持迁移外部化、受控,避免多实例
  # 启动竞争跑 schema,以及把 schema 变更与应用启动解耦),因此由本 one-shot 服务
  # 在 gateway 之前把 sql/migrations 应用到 postgres;它成功退出(service_completed_successfully)
  # 后 gateway 才启动。migrate/migrate 是迁移工具镜像,与 dev 流程一致;迁移幂等,重复 up 安全。
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sql/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database"
      - "${HUAKAI_DATABASE_URL}"
      - "up"
    networks:
      - huakai-prod
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: huakai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: huakai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - huakai-prod-pgdata:/var/lib/postgresql/data
    networks:
      - huakai-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huakai -d huakai"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  huakai-prod:
    name: huakai-prod-net

volumes:
  huakai-prod-pgdata:
