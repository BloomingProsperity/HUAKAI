# HUAKAI production docker-compose.
# DO NOT use for local dev — use docker-compose.dev.yml instead.
#
# Required env vars (set in .env or shell before running):
#   HUAKAI_DATABASE_URL              - PostgreSQL DSN (passed through to gateway)
#   HUAKAI_CREDENTIAL_KEY_B64        - 32-byte base64 encryption key
#   HUAKAI_SESSION_SIGNING_KEY_B64   - JWT session signing key (base64), OR
#   HUAKAI_SESSION_SIGNING_KEY_HEX   - JWT session signing key (hex, >=32 bytes)
#   HUAKAI_ADMIN_BOOTSTRAP_TOKEN     - one-time bootstrap admin token (rotate after first use)
#   HUAKAI_RELEASE_MODE              - must be: production
#   POSTGRES_PASSWORD                - postgres superuser password
#
# Usage:
#   HUAKAI_DATABASE_URL=postgres://huakai:secret@postgres:5432/huakai?sslmode=disable #   HUAKAI_CREDENTIAL_KEY_B64=... HUAKAI_SESSION_SIGNING_KEY_B64=... #   HUAKAI_ADMIN_BOOTSTRAP_TOKEN=... HUAKAI_RELEASE_MODE=production #   POSTGRES_PASSWORD=secret #   docker compose -f docker-compose.prod.yml up -d

services:
  gateway:
    build:
      # context 上移到仓库根：Dockerfile 需要同时读取 Go 后端与 Rust sidecar workspace。
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # gateway 不再对宿主暴露明文端口:外部流量经下方 caddy 反代终结 TLS 后转发,gateway 仅
    # 在 compose 内网可达(防绕过 TLS 直连明文 + 防外部伪造 X-Forwarded-For)。
    expose:
      - "8080"
    environment:
      HUAKAI_DATABASE_URL: ${HUAKAI_DATABASE_URL}
      HUAKAI_CREDENTIAL_KEY_B64: ${HUAKAI_CREDENTIAL_KEY_B64}
      HUAKAI_SESSION_SIGNING_KEY_B64: ${HUAKAI_SESSION_SIGNING_KEY_B64:-}
      HUAKAI_SESSION_SIGNING_KEY_HEX: ${HUAKAI_SESSION_SIGNING_KEY_HEX:-}
      HUAKAI_ADMIN_BOOTSTRAP_TOKEN: ${HUAKAI_ADMIN_BOOTSTRAP_TOKEN}
      HUAKAI_RELEASE_MODE: ${HUAKAI_RELEASE_MODE}
      # 生产公网限流使用共享 Redis；多副本不会按副本数放大未认证请求预算。
      HUAKAI_RATE_LIMIT_REDIS_URL: ${HUAKAI_RATE_LIMIT_REDIS_URL:-redis://redis:6379/0}
      # Go 网关与同镜像 Rust TLS sidecar 的唯一出口合同。
      HUAKAI_TRANSPORT_SIDECAR_SOCKET: /run/huakai/tls-sidecar.sock
      # CRS 来源默认关闭；部署者只需配置白名单即可开启，私网访问必须单独显式授权。
      HUAKAI_CRS_SOURCE_ALLOWED_HOSTS: ${HUAKAI_CRS_SOURCE_ALLOWED_HOSTS:-}
      HUAKAI_CRS_SOURCE_ALLOW_PRIVATE_HOSTS: ${HUAKAI_CRS_SOURCE_ALLOW_PRIVATE_HOSTS:-false}
      # quota reconciler 默认启用(unset/非法值均按 true):补偿结算/释放失败和孤儿预留。
      # 仅应急停用时显式设 false 或 0。
      HUAKAI_QUOTA_RECONCILER_ENABLED: ${HUAKAI_QUOTA_RECONCILER_ENABLED:-true}
      # 告警规则评估器默认启用(unset/非法值均按 true):无告警规则时评估循环空转 no-op,
      # LeaderLock 已防多副本重复。配了告警规则却不评估会静默失效,故默认开;应急停用设 false 或 0。
      HUAKAI_ALERTING_EVAL_ENABLED: ${HUAKAI_ALERTING_EVAL_ENABLED:-true}
      # 内容审核执行器默认启用(unset/非法值均按 true):执行器恒接线,但租户级审核配置默认
      # Enabled=false;未在 admin 面显式开启审核的租户仍全量放行。整机应急停用设 false 或 0。
      HUAKAI_CONTENT_MODERATION_ENABLED: ${HUAKAI_CONTENT_MODERATION_ENABLED:-true}
      # 内置实例监测默认开启。多副本部署必须为每个副本配置唯一、稳定的 opaque 节点 ID；
      # 留空会使用运行环境摘要并在管理 API 标记为不稳定身份。
      HUAKAI_SERVER_MONITOR_ENABLED: ${HUAKAI_SERVER_MONITOR_ENABLED:-true}
      HUAKAI_SERVER_MONITOR_NODE_ID: ${HUAKAI_SERVER_MONITOR_NODE_ID:-}
      HUAKAI_SERVER_MONITOR_DISPLAY_NAME: ${HUAKAI_SERVER_MONITOR_DISPLAY_NAME:-}
      HUAKAI_SERVER_MONITOR_INTERVAL: ${HUAKAI_SERVER_MONITOR_INTERVAL:-30s}
      HUAKAI_SERVER_MONITOR_OFFLINE_AFTER: ${HUAKAI_SERVER_MONITOR_OFFLINE_AFTER:-90s}
      # 信任 caddy 反代(本 compose 内网)转发的 X-Forwarded-For,使 per-IP 限流按真实
      # 客户端 IP 计算而非 caddy 自身 IP。默认信任全部 RFC1918 私网段:gateway 仅在 compose
      # 内网可达(expose 非 ports),能连它的只有同网 caddy(必属私网 IP),外部到不了无从伪造;
      # clientip 解析对非可信来源的 XFF 一律忽略(fail-closed)。放宽到 RFC1918 同时免去固定
      # 子网与宿主已有 docker 网段撞车(pool overlap)的起栈失败。
      HUAKAI_TRUSTED_PROXY_CIDRS: ${HUAKAI_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # production 模式硬要求:审计账本持久化到 postgres + 持久 ed25519 私钥签名
      # (缺任一启动 fail-loud 拒启)。私钥由运维用 `openssl genpkey -algorithm ed25519`
      # 生成后挂载到容器内固定路径;切勿提交私钥进仓库。
      HUAKAI_AUDIT_LEDGER_BACKEND: ${HUAKAI_AUDIT_LEDGER_BACKEND:-postgres}
      HUAKAI_AUDIT_PRIVATE_KEY_PATH: /run/secrets/audit/key.pem
      # Hermes 默认关闭。只有显式设置 runner URL 后才加载私钥和内部令牌；模型与 MCP
      # 都回到本 gateway，继续经过正式账号池、费用证据和日志链。
      HUAKAI_HERMES_RUNNER_URL: ${HUAKAI_HERMES_RUNNER_URL:-}
      HUAKAI_HERMES_JWT_PRIVATE_KEY_PATH: /run/secrets/hermes/private.pem
      HUAKAI_HERMES_JWT_KID: ${HUAKAI_HERMES_JWT_KID:-compose-hermes}
      HUAKAI_HERMES_INTERNAL_TOKEN_SECRET: ${HUAKAI_HERMES_INTERNAL_TOKEN_SECRET:-}
      HUAKAI_HERMES_LLM_TOOLLOOP_ENABLED: ${HUAKAI_HERMES_LLM_TOOLLOOP_ENABLED:-true}
      HUAKAI_HERMES_LLM_PROPOSE_ENABLED: ${HUAKAI_HERMES_LLM_PROPOSE_ENABLED:-false}
      HUAKAI_HERMES_MUTATING_ENABLED: ${HUAKAI_HERMES_MUTATING_ENABLED:-true}
    volumes:
      # 运维在宿主生成 ed25519 私钥并经 HUAKAI_AUDIT_PRIVATE_KEY_HOST 指向它
      # (默认 ./secrets/audit_key.pem);只读挂载,容器内路径与上面 env 对应。
      - ${HUAKAI_AUDIT_PRIVATE_KEY_HOST:-./secrets/audit_key.pem}:/run/secrets/audit/key.pem:ro
      # 目录可在 Hermes 关闭时为空；启用前用 generate-keypair.sh 生成密钥。
      - ${HUAKAI_HERMES_KEYS_HOST_DIR:-./secrets/hermes}:/run/secrets/hermes:ro
    networks:
      - huakai-prod
      - huakai-hermes
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # 官方 Hermes 只负责推理循环。该服务默认不随主栈启动；启用时通过隔离内网
  # 访问 HUAKAI MCP，并通过独立出口网络访问租户配置的外部模型服务。
  # 它没有宿主端口、持久目录、数据库或 Redis 网络访问。
  hermes-runner:
    profiles: ["hermes"]
    build:
      context: ./deploy/hermes-runner
    depends_on:
      gateway:
        condition: service_healthy
      hermes-egress:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8801"
    environment:
      HUAKAI_HERMES_JWT_PUBLIC_KEY_PATH: /run/secrets/hermes/public.pem
      HUAKAI_HERMES_JWT_KID: ${HUAKAI_HERMES_JWT_KID:-compose-hermes}
      HUAKAI_HERMES_MCP_URL: http://gateway:8080/internal/hermes/mcp
      HUAKAI_HERMES_EGRESS_PROXY_URL: http://hermes-egress:8080
      HUAKAI_HERMES_RUNNER_BIND: 0.0.0.0:8801
      HUAKAI_HERMES_MAX_CONCURRENCY: ${HUAKAI_HERMES_MAX_CONCURRENCY:-1}
      HUAKAI_HERMES_QUEUE_TIMEOUT_SECONDS: ${HUAKAI_HERMES_QUEUE_TIMEOUT_SECONDS:-10}
      HUAKAI_HERMES_PROCESS_TIMEOUT_SECONDS: ${HUAKAI_HERMES_PROCESS_TIMEOUT_SECONDS:-240}
    volumes:
      - ${HUAKAI_HERMES_KEYS_HOST_DIR:-./secrets/hermes}/public.pem:/run/secrets/hermes/public.pem:ro
    read_only: true
    tmpfs:
      - /run/huakai-hermes:rw,noexec,nosuid,nodev,size=128m,uid=10101,gid=10101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 1.0
    networks:
      - huakai-hermes

  # runner 没有公网路由；所有外部模型连接必须经过本代理。代理在实际 CONNECT 拨号时
  # 拒绝内网、回环、链路本地、保留地址和混合 DNS 返回集，并固定已校验的公网 IP。
  hermes-egress:
    profiles: ["hermes"]
    build:
      context: ./deploy/hermes-runner
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--", "python3", "/app/egress_proxy.py"]
    environment:
      HUAKAI_HERMES_EGRESS_BIND: 0.0.0.0:8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    networks:
      - huakai-hermes
      - huakai-hermes-egress
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 反向代理 + 自动 HTTPS(一键上线的 TLS 终结层)。Caddy 对 HUAKAI_PUBLIC_DOMAIN 自动签发/
  # 续期 Let's Encrypt 证书(需 80/443 对公网可达 + 域名解析到本机),并反代到内网 gateway:8080。
  # 证书持久化在 caddy-data 卷,重启不重签。配置见同目录 Caddyfile。
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    environment:
      HUAKAI_PUBLIC_DOMAIN: ${HUAKAI_PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 ACME 账户持久化:重启不重签,避免触发 Let's Encrypt 速率限制。
      - huakai-prod-caddy-data:/data
      - huakai-prod-caddy-config:/config
    networks:
      - huakai-prod

  # 一次性数据库迁移。gateway 刻意不自管迁移(保持迁移外部化、受控,避免多实例
  # 启动竞争跑 schema,以及把 schema 变更与应用启动解耦),因此由本 one-shot 服务
  # 在 gateway 之前把 sql/migrations 应用到 postgres;它成功退出(service_completed_successfully)
  # 后 gateway 才启动。migrate/migrate 是迁移工具镜像,与 dev 流程一致;迁移幂等,重复 up 安全。
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sql/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database"
      - "${HUAKAI_DATABASE_URL}"
      - "up"
    networks:
      - huakai-prod
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: huakai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: huakai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - huakai-prod-pgdata:/var/lib/postgresql/data
    networks:
      - huakai-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huakai -d huakai"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    networks:
      - huakai-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  huakai-prod:
    name: huakai-prod-net
    # 不固定子网:让 docker 自动选可用网段,避免与宿主已有 docker 网络撞车(pool overlap)。
    # gateway 的 HUAKAI_TRUSTED_PROXY_CIDRS 默认覆盖全部 RFC1918,docker 自选网段必落其内。
  huakai-hermes:
    name: huakai-hermes-prod-net
    internal: true
  huakai-hermes-egress:
    name: huakai-hermes-prod-egress-net

volumes:
  huakai-prod-pgdata:
  huakai-prod-caddy-data:
  huakai-prod-caddy-config:
