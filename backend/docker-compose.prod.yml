# HUAKAI production docker-compose — full relay stack behind Caddy TLS.
# DO NOT use for local dev — use docker-compose.dev.yml instead.
#
# First boot is NOT a bare `up`: generate secrets, set your domain, then up.
# See docs/ops/DEPLOYMENT.md for the exact runbook. Quick version:
#   1. cd backend && ./deploy/gen-secrets.sh        # writes .env.prod + deploy/keys/audit_ed25519.key
#   2. edit Caddyfile  -> set your real domain (and point its DNS A/AAAA at this host)
#   3. docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# The migrate service applies all SQL migrations before the gateway starts.
#
# Required env (generated into .env.prod by deploy/gen-secrets.sh):
#   POSTGRES_PASSWORD, HUAKAI_DATABASE_URL, HUAKAI_CREDENTIAL_KEY_B64,
#   HUAKAI_SESSION_SIGNING_KEY_B64, HUAKAI_ADMIN_BOOTSTRAP_TOKEN,
#   HUAKAI_RELEASE_MODE=production, HUAKAI_USER_REGISTRATION_MODE (optional: open|invite_required|disabled)

services:
  # One-shot: apply all SQL migrations against the prod DB, then exit. The gateway
  # waits for this to complete so an empty database is fully schema'd before boot.
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./sql/migrations:/migrations:ro
    command: ["-path=/migrations", "-database", "${HUAKAI_DATABASE_URL}", "up"]
    networks:
      - huakai-prod

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Not published to the host — Caddy fronts it. Reachable on the compose network only.
    expose:
      - "8080"
    environment:
      HUAKAI_DATABASE_URL: ${HUAKAI_DATABASE_URL}
      HUAKAI_CREDENTIAL_KEY_B64: ${HUAKAI_CREDENTIAL_KEY_B64}
      HUAKAI_SESSION_SIGNING_KEY_B64: ${HUAKAI_SESSION_SIGNING_KEY_B64:-}
      HUAKAI_SESSION_SIGNING_KEY_HEX: ${HUAKAI_SESSION_SIGNING_KEY_HEX:-}
      HUAKAI_ADMIN_BOOTSTRAP_TOKEN: ${HUAKAI_ADMIN_BOOTSTRAP_TOKEN}
      HUAKAI_RELEASE_MODE: ${HUAKAI_RELEASE_MODE}
      HUAKAI_USER_REGISTRATION_MODE: ${HUAKAI_USER_REGISTRATION_MODE:-disabled}
      # Production mode requires a signed audit ledger backed by postgres plus an
      # ed25519 signing key mounted read-only (generated by deploy/gen-secrets.sh).
      HUAKAI_AUDIT_LEDGER_BACKEND: postgres
      HUAKAI_AUDIT_PRIVATE_KEY_PATH: /run/secrets/keys/audit_ed25519.key
    volumes:
      - ./deploy/keys:/run/secrets/keys:ro
    networks:
      - huakai-prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Next.js frontend (Admin UI + user portal) as its own Node server. Caddy
  # path-routes non-API paths here; the gateway URL drives its runtime rewrites.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - gateway
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      HUAKAI_GATEWAY_URL: http://gateway:8080
    networks:
      - huakai-prod

  # Caddy terminates TLS (automatic HTTPS for the domain set in Caddyfile) and
  # routes API paths to the gateway, everything else to the frontend.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - gateway
      - frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - huakai-caddy-data:/data
      - huakai-caddy-config:/config
    networks:
      - huakai-prod

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: huakai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: huakai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - huakai-prod-pgdata:/var/lib/postgresql/data
    networks:
      - huakai-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huakai -d huakai"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  huakai-prod:
    name: huakai-prod-net

volumes:
  huakai-prod-pgdata:
  huakai-caddy-data:
  huakai-caddy-config:
