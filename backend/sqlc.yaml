version: "2"
sql:
  - engine: postgresql
    schema: sql/migrations
    queries: sql/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_methods_with_db_argument: false
        emit_prepared_queries: false
        rename:
          tenant_id: TenantID
          api_key_id: APIKeyID
          provider_id: ProviderID
          channel_id: ChannelID
          pool_group_id: PoolGroupID
          provider_account_id: ProviderAccountID
          claim_id: ClaimID
          acquisition_token: AcquisitionToken
          dlq: DLQ
          oauth_endpoint_health: OAuthEndpointHealth
          openai_403_counter: OpenAI403Counter
overrides:
  go:
    overrides:
      - column: "billing_ledger_claims.predicted_cost"
        go_type: "github.com/shopspring/decimal.Decimal"
      - column: "billing_ledger_claims.actual_cost"
        go_type: "github.com/shopspring/decimal.NullDecimal"
      - column: "usage_records.actual_cost"
        go_type: "github.com/shopspring/decimal.Decimal"
      - column: "billing_events.actual_cost"
        go_type: "github.com/shopspring/decimal.Decimal"
      - column: "billing_events.actual_cost_signed"
        go_type: "github.com/shopspring/decimal.Decimal"
      - column: "pool_slot_acquisitions.acquisition_token"
        go_type: "github.com/google/uuid.UUID"
      - column: "billing_ledger_claims.acquisition_token"
        go_type: "github.com/google/uuid.UUID"
